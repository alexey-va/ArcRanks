surfaces:
  dialogs:
    - id: rank-dialog-root
      source: ranks
      format: reference-multi-action
      name-key: dialogs.root.title
      external-title-key: dialogs.root.title
      columns: 2
      body:
        - {id: intro, text-key: dialogs.root.intro, width: 520}
        - {id: status, text-key: dialogs.root.status, width: 520, placeholders: {rank: Горожанин, focus: Земледелие}}
        - {id: next, text-key: dialogs.root.next, width: 520, placeholders: {next: Ремесленник, recommendation: 'Земледелие: ещё 120 урожая'}}
      buttons:
        - {id: paths, text-key: dialogs.root.paths, tooltip-key: dialogs.common.open-tooltip, width: 190}
        - {id: benefits, text-key: dialogs.root.benefits, tooltip-key: dialogs.common.open-tooltip, width: 190}
        - {id: contracts, text-key: dialogs.root.contracts, tooltip-key: dialogs.common.open-tooltip, width: 190}
        - {id: perks, text-key: dialogs.root.perks, tooltip-key: dialogs.common.open-tooltip, width: 190}
        - {id: weekly, text-key: dialogs.root.weekly-kit, tooltip-key: dialogs.common.open-tooltip, width: 190}
        - {id: admin, text-key: dialogs.admin.advance, tooltip-key: dialogs.admin.advance-tooltip, width: 190}
      viewport: [854, 480]
      variants: [{id: player}, {id: admin}]

    - id: rank-dialog-paths
      source: ranks
      format: reference-multi-action
      name-key: dialogs.paths.title
      external-title-key: dialogs.paths.title
      columns: 2
      body:
        - {id: intro, text-key: dialogs.paths.intro, width: 520}
        - {id: status, text-key: dialogs.paths.status, width: 520, placeholders: {completed: '2', required: '3', focus: Земледелие}}
      buttons:
        - {id: farming, text-key: paths.farming.name, tooltip-key: paths.farming.summary, width: 190}
        - {id: industry, text-key: paths.industry.name, tooltip-key: paths.industry.summary, width: 190}
        - {id: trade, text-key: paths.trade.name, tooltip-key: paths.trade.summary, width: 190}
        - {id: exploration, text-key: paths.exploration.name, tooltip-key: paths.exploration.summary, width: 190}
        - {id: building, text-key: paths.building.name, tooltip-key: paths.building.summary, width: 190}
        - {id: community, text-key: paths.community.name, tooltip-key: paths.community.summary, width: 190}
      viewport: [854, 480]
      variants: [{id: current}]

    - id: rank-dialog-path-detail
      source: ranks
      format: reference-multi-action
      name-key: paths.industry.name
      external-title-key: paths.industry.name
      columns: 2
      body:
        - {id: explanation, text-key: dialogs.paths.detail, width: 440, placeholders: {path: Промышленность, summary: 'Переработка и производство', details: 'Растёт за создание предметов и продукцию из печей.'}}
        - {id: actions, text-key: dialogs.paths.actions, width: 440}
        - {id: sources, text-key: paths.industry.sources, width: 440}
        - {id: progress, text-key: dialogs.paths.progress, width: 440, placeholders: {bar: '<#2bba43>■■■■■■■■■■</color><#8c8c8c>□□□□□□</color>', current: '8 420', target: '12 000', percent: '70', mastery: II, state: 'условие ещё выполняется'}}
        - {id: focus, text-key: dialogs.paths.focus-explanation, width: 440}
      buttons:
        - {id: focus, text-key: dialogs.paths.select-focus, tooltip-key: dialogs.paths.select-focus-tooltip, width: 220}
        - {id: all, text-key: dialogs.paths.all, tooltip-key: dialogs.common.open-tooltip, width: 220}
      viewport: [854, 480]
      variants: [{id: industry}]

    - id: rank-dialog-contract-offers
