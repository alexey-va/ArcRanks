        - {id: active, text-key: dialogs.contracts.active-ready, width: 520, placeholders: {path: Земледелие, target: '180', bar: '▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰', reward: '18', money: '2 000', tokens: '1', item-amount: '1', item: 'Токен зачарования'}}
