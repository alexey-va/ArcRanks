      format: reference-multi-action
      name-key: dialogs.contracts.title
      external-title-key: dialogs.contracts.title
      columns: 2
      body:
        - {id: intro, text-key: dialogs.contracts.intro, width: 520}
        - {id: status, text-key: dialogs.contracts.status, width: 520, placeholders: {period: '24 августа — 30 августа', stamps: '1', remaining: '2'}}
        - {id: offer, text-key: dialogs.contracts.offer, width: 520, placeholders: {number: '1', path: Земледелие, target: '180', reward: '18', money: '2 000', tokens: '1', item-amount: '1', item: 'Токен зачарования'}}
      buttons:
        - {id: accept, text-key: dialogs.contracts.accept, tooltip-key: dialogs.contracts.accept-tooltip, width: 220, placeholders: {number: '1'}}
