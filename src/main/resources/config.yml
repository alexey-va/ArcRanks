# One ArcRanks JAR runs on every Paper backend. Progress is stored in the shared MySQL database.
server-id: survival

# SHADOW counts and displays progress but cannot mutate LuckPerms. Switch to ACTIVE only after migration checks.
promotion-mode: SHADOW

# Operational feature gates are live. Disabling a feature closes ArcRanks menus,
# blocks new actions, and (for perks) suspends gameplay bonuses immediately.
features:
  contracts: true
  perks: true
  weekly-kits: true

locale:
  default: ru
  use-client-locale: false

mysql:
  host: mysql
  port: 3306
  database: minecraft
  username: minecraft
  # The secret never belongs in YAML or Git. Use the process environment or
  # put only the raw password in plugins/ArcRanks/.env (environment wins).
  password-env: ARC_RANKS_MYSQL_PASSWORD
  ssl-mode: DISABLED
  minimum-idle: 1
  maximum-pool-size: 4
  connection-timeout-ms: 10000
  socket-timeout-ms: 30000
  validation-timeout-ms: 5000
  max-lifetime-ms: 1700000
  fail-fast: true

# Startup timeout is evaluated only while enabling the plugin. The shutdown and
# health periods are live and are picked up by /rank admin reload.
runtime:
  startup-timeout-seconds: 30
  shutdown-flush-timeout-seconds: 5
  health-report-ticks: 1200

progress:
  maximum-buffer-entries: 4096
  flush-ticks: 300
  sample-ticks: 1200
  maximum-idle-seconds: 300
  maximum-movement-step-blocks: 16.0
  community-radius-blocks: 64.0
  # Collection policy is live. Empty included-worlds means every world except
  # those explicitly listed in excluded-worlds. Creative/spectator collection
  # is intentionally not supported because it would make progression trivial.
  collection:
    enabled: true
    eligible-game-modes: [SURVIVAL, ADVENTURE]
    included-worlds: []
    excluded-worlds: []
    # Shared local anti-repeat window for blocks, hanging decorations and tools.
    building-repeat-window-seconds: 21600
    builder-tools:
      enabled: true
      maximum-progress-per-operation: 128
    block-place:
      enabled: true
      amount: 1
      included-materials: []
      excluded-materials: []
    mature-crop:
      enabled: true
      amount: 1
      materials: [WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART, COCOA, SWEET_BERRY_BUSH, PITCHER_CROP, TORCHFLOWER_CROP]
    animal-breeding:
      enabled: true
      amount: 8
    fishing:
      enabled: true
      amount: 5
    crafting:
      enabled: true
      amount: 1
      included-materials: []
      excluded-materials: []
    furnace:
      enabled: true
      amount: 1
      included-materials: []
      excluded-materials: []
    enchanting:
      enabled: true
      amount: 10
    smithing:
      enabled: true
      amount: 15
    villager-trade:
      enabled: true
      amount: 500
    # Both sides receive progress equal to the completed deal price, capped to
    # make very large transfers useful without turning one sale into a whole path.
    auction-deal:
      enabled: true
      maximum-progress-per-deal: 100000
    travel:
      enabled: true
      include-vertical: true
    exploration-advancement:
      enabled: true
      amount: 2500
    dungeon-completion:
      enabled: true
      amount: 10000
    decoration-place:
      enabled: true
      amount: 1
    active:
      enabled: true
    community:
      enabled: true
      minimum-nearby-players: 1
      shared-advancement:
        enabled: true
        amount: 15
      # One meaningful, non-repeated message may earn progress once per minute.
      # This keeps normal conversation useful without rewarding chat spam.
      chat:
        enabled: true
        amount: 1
        cooldown-seconds: 60
        duplicate-window-seconds: 600
        minimum-letters-or-digits: 4
    wealth:
      enabled: true

analytics:
  enabled: true
  flush-ticks: 1200
  maximum-metric-keys: 512
  maximum-players: 4096
  summary-cache-seconds: 60
  windows: [7, 14, 30]
  default-window: 7

# Runtime may set custom-model-data: 11000 for the shared arc:background item.
# Plain Bukkit materials remain a portable fallback for previews and tests.
gui:
  # Layout topology is validated as one atomic generation. Code addresses only semantic IDs.
  layouts:
    passport:
      schema-version: 1
      rows: 5
      elements:
        profile: {slot: 4}
        daily-quests: {slot: 28}
        contracts: {slot: 30}
        paths: {slot: 31}
        perks: {slot: 32}
        weekly-kit: {slot: 39}
        promotion: {slot: 40}
        admin-advance: {slot: 36}
        admin-analytics: {slot: 44}
      regions:
        ranks: {slots: ['9-17']}
    daily-quests:
      schema-version: 1
      rows: 3
      elements:
        status: {slot: 4}
        back: {slot: 18}
        refresh: {slot: 26}
      regions:
        quests: {slots: [11, 13, 15]}
    paths:
      schema-version: 1
      rows: 5
      elements:
        profile: {slot: 4}
        guide: {slot: 22}
        back: {slot: 36}
      regions:
        paths: {slots: [19, 20, 21, 23, 24, 25]}
    contracts:
      schema-version: 1
      rows: 6
      elements:
        status: {slot: 4}
        reroll: {slot: 40}
        admin-complete: {slot: 48}
        back: {slot: 45}
        refresh: {slot: 53}
      regions:
        stamps: {slots: [10, 13, 16]}
        cards: {slots: [20, 22, 24]}
    perk-slots:
      schema-version: 1
      rows: 5
      elements:
        status: {slot: 4}
        back: {slot: 36}
        refresh: {slot: 44}
      regions:
        slots: {slots: [21, 23]}
    perk-selection:
      schema-version: 1
      rows: 6
      elements:
        status: {slot: 4}
        farming: {slot: 9}
        industry: {slot: 14}
        trade: {slot: 18}
        exploration: {slot: 23}
        building: {slot: 27}
        community: {slot: 32}
        back: {slot: 45}
        refresh: {slot: 53}
      regions:
        offers: {slots: [10, 11, 12, 15, 16, 17, 19, 20, 21, 24, 25, 26, 28, 29, 30, 33, 34, 35]}
    weekly-kit:
      schema-version: 1
      rows: 5
      elements:
        summary: {slot: 20}
        contents: {slot: 22}
        claim: {slot: 24}
        back: {slot: 36}
        admin-reset: {slot: 44}
    analytics:
      schema-version: 1
      rows: 6
      elements:
        status: {slot: 4}
        overview: {slot: 20}
        contracts: {slot: 22}
        perks: {slot: 24}
        promotions: {slot: 30}
        recommendations: {slot: 32}
        health: {slot: 40}
        back: {slot: 45}
        refresh: {slot: 53}
      regions:
        windows: {slots: [10, 13, 16]}
  background:
    material: GRAY_STAINED_GLASS_PANE
    custom-model-data: 0
  # Runtime uses the shared arc:left_gray model (CMD 11013).
  back:
    material: BLUE_STAINED_GLASS_PANE
    custom-model-data: 11013
  rank-completed:
    material: LIME_STAINED_GLASS_PANE
    custom-model-data: 0
  rank-current:
    material: ORANGE_STAINED_GLASS_PANE
    custom-model-data: 0
  rank-next:
    material: YELLOW_STAINED_GLASS_PANE
    custom-model-data: 0
  rank-locked:
    material: GRAY_STAINED_GLASS_PANE
    custom-model-data: 0
  path:
    material: BOOK
    custom-model-data: 0
  promotion:
    material: NETHER_STAR
    custom-model-data: 0
  contracts:
    material: WRITABLE_BOOK
    custom-model-data: 0
  perks:
    material: ENCHANTED_BOOK
    custom-model-data: 0
  analytics:
    material: SPYGLASS
    custom-model-data: 0
  promotion-blocked-ticks: 40
  # Every auxiliary icon is addressable here. Inventory topology lives in
  # gui.layouts above; MiniMessage names/lore and their value tags live in
  # lang/*.yml. Code supplies safe Component values and semantic actions only.
  items:
    refresh: { material: CLOCK, custom-model-data: 0 }
    loading: { material: CLOCK, custom-model-data: 0 }
    running: { material: CLOCK, custom-model-data: 0 }
    error: { material: RED_STAINED_GLASS_PANE, custom-model-data: 0 }
    passport-profile: { material: PLAYER_HEAD, custom-model-data: 0 }
    passport-guide: { material: MAP, custom-model-data: 0 }
    passport-paths: { material: COMPASS, custom-model-data: 0 }
    passport-weekly-kit: { material: CHEST, custom-model-data: 0 }
    passport-benefits: { material: GOLD_INGOT, custom-model-data: 0 }
    passport-admin-advance: { material: COMMAND_BLOCK, custom-model-data: 0 }
    passport-admin-analytics: { material: SPYGLASS, custom-model-data: 0 }
    path-farming: { material: WHEAT, custom-model-data: 0 }
    path-industry: { material: BLAST_FURNACE, custom-model-data: 0 }
    path-trade: { material: EMERALD, custom-model-data: 0 }
    path-exploration: { material: COMPASS, custom-model-data: 0 }
    path-building: { material: BRICKS, custom-model-data: 0 }
    path-community: { material: CAMPFIRE, custom-model-data: 0 }
    contract-status: { material: PAPER, custom-model-data: 0 }
    contract-stamp: { material: HONEYCOMB, custom-model-data: 0 }
    contract-complete: { material: SUNFLOWER, custom-model-data: 0 }
    contract-reroll: { material: AMETHYST_SHARD, custom-model-data: 0 }
    contract-disabled: { material: GRAY_DYE, custom-model-data: 0 }
    contract-claim-ready: { material: CHEST, custom-model-data: 0 }
    contract-claim-active: { material: LIGHT_GRAY_DYE, custom-model-data: 0 }
    contract-progress: { material: COMPASS, custom-model-data: 0 }
    contract-admin-complete: { material: COMMAND_BLOCK, custom-model-data: 0 }
    perk-empty-slot: { material: BOOK, custom-model-data: 0 }
    perk-available: { material: BOOK, custom-model-data: 0 }
    perk-selected: { material: ENCHANTED_BOOK, custom-model-data: 0 }
    perk-other: { material: LIME_DYE, custom-model-data: 0 }
    perk-locked: { material: GRAY_DYE, custom-model-data: 0 }
    analytics-window: { material: CLOCK, custom-model-data: 0 }
    analytics-overview: { material: MAP, custom-model-data: 0 }
    analytics-contracts: { material: WRITABLE_BOOK, custom-model-data: 0 }
    analytics-perks: { material: ENCHANTED_BOOK, custom-model-data: 0 }
    analytics-promotions: { material: NETHER_STAR, custom-model-data: 0 }
    analytics-recommendations: { material: COMPASS, custom-model-data: 0 }
    analytics-health: { material: REDSTONE_TORCH, custom-model-data: 0 }
    weekly-kit-contents: { material: BOOK, custom-model-data: 0 }
    weekly-kit-available: { material: CHEST, custom-model-data: 0 }
    weekly-kit-delivering: { material: CLOCK, custom-model-data: 0 }
    weekly-kit-claimed: { material: LIME_DYE, custom-model-data: 0 }
    weekly-kit-admin-reset: { material: COMMAND_BLOCK, custom-model-data: 0 }
    weekly-kit-admin-disabled: { material: GRAY_DYE, custom-model-data: 0 }

# Presentation is fully live. The console command used for cross-server
# broadcast is intentionally not configurable: only this boolean profile gate
# controls whether the fixed, sanitized transport is used.
celebration:
  enabled: true
  title:
    enabled: true
    fade-in-ms: 400
    stay-ms: 3000
    fade-out-ms: 700
  sound:
    enabled: true
    type: ENTITY_PLAYER_LEVELUP
    category: PLAYERS
    volume: 1.0
    pitch: 1.05
  particles:
    enabled: true
    color: { red: 217, green: 134, blue: 79 }
    size: 1.1
    radius: 1.35
    origin-y-offset: 0.25
    vertical-step: 0.08
  fireworks:
    enabled: true
    delay-ticks: 12
    origin-y-offset: 0.35
    horizontal-offset: 0.65
    type: BALL
    colors:
      1: { red: 217, green: 134, blue: 79 }
      2: { red: 244, green: 189, blue: 106 }
    fade-colors:
      1: { red: 255, green: 240, blue: 216 }
    trail: true
    flicker: false
  profiles:
    1: { particle-count: 12, firework-count: 0, network-broadcast: false }
    2: { particle-count: 12, firework-count: 0, network-broadcast: false }
    3: { particle-count: 12, firework-count: 0, network-broadcast: false }
    4: { particle-count: 24, firework-count: 1, network-broadcast: false }
    5: { particle-count: 24, firework-count: 1, network-broadcast: false }
    6: { particle-count: 24, firework-count: 1, network-broadcast: false }
    7: { particle-count: 36, firework-count: 2, network-broadcast: true }
    8: { particle-count: 36, firework-count: 2, network-broadcast: true }
    9: { particle-count: 36, firework-count: 2, network-broadcast: true }
