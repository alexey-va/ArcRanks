    weekly-kit-admin-reset: { material: COMMAND_BLOCK, custom-model-data: 0 }
    weekly-kit-admin-disabled: { material: GRAY_DYE, custom-model-data: 0 }

# Typed celebration catalog. Personal title/toast/sound goes only to the player;
# particles and display entities are sent to the bounded nearby viewer set.
celebration:
  enabled: true
  routes:
    quest:
      default: quest_burst
      rare: quest_crown
      advanced: quest_helix
      by-id:
        dungeon_challenge: quest_starfall
    rank:
      default: rank_ascension
      by-id:
        peasant: rank_orbit
        citizen: rank_ribbon
        artisan: rank_ascension
        knight: rank_orbit
        baron: rank_ribbon
        count: rank_ascension
        prince: rank_finale
        caesar: rank_finale
  scenes:
    quest_burst:
      recipe: BURST
      duration-ticks: 30
      particle-count: 10
      radius: 1.1
      height: 1.8
      particle-size: 0.8
      colors: { primary: { red: 85, green: 217, blue: 139 }, secondary: { red: 255, green: 240, blue: 216 } }
      shared: { radius-blocks: 20.0, maximum-viewers: 12 }
      personal:
        title-key: celebration.quest.title
        subtitle-key: celebration.quest.subtitle
        action-bar-key: celebration.quest.action-bar
        toast: { key: celebration.quest.toast, material: WRITABLE_BOOK, custom-model-data: 0 }
        sound: { type: ENTITY_EXPERIENCE_ORB_PICKUP, category: PLAYERS, volume: 0.9, pitch: 1.25 }
      display: { type: ITEM, pattern: SHARDS, count: 5, follow-player: true, spin-degrees-per-tick: 14.0, glow: true, text-key: '', material: WRITABLE_BOOK, custom-model-data: 0, y-offset: 2.2, scale: 0.62, ttl-ticks: 36 }
      fireworks: { count: 0, type: BALL, trail: false, flicker: false }
      network-broadcast: false
    quest_helix:
      recipe: HELIX
      duration-ticks: 52
      particle-count: 14
      radius: 1.15
      height: 2.8
      particle-size: 0.9
      colors: { primary: { red: 85, green: 199, blue: 255 }, secondary: { red: 178, green: 124, blue: 255 } }
      shared: { radius-blocks: 24.0, maximum-viewers: 16 }
      personal:
        title-key: celebration.quest.advanced-title
        subtitle-key: celebration.quest.subtitle
        action-bar-key: celebration.quest.action-bar
        toast: { key: celebration.quest.toast, material: ENCHANTED_BOOK, custom-model-data: 0 }
        sound: { type: BLOCK_AMETHYST_BLOCK_CHIME, category: PLAYERS, volume: 1.0, pitch: 1.15 }
      display: { type: ITEM, pattern: HELIX, count: 6, follow-player: true, spin-degrees-per-tick: 9.0, glow: true, text-key: '', material: ENCHANTED_BOOK, custom-model-data: 0, y-offset: 2.45, scale: 0.56, ttl-ticks: 58 }
      fireworks: { count: 0, type: BURST, trail: true, flicker: false }
      network-broadcast: false
    quest_crown:
      recipe: CROWN
      duration-ticks: 48
      particle-count: 16
      radius: 1.3
      height: 2.4
      particle-size: 1.0
      colors: { primary: { red: 255, green: 209, blue: 102 }, secondary: { red: 255, green: 240, blue: 216 } }
      shared: { radius-blocks: 26.0, maximum-viewers: 18 }
      personal:
        title-key: celebration.quest.rare-title
