# Daily assignments are frozen per player until the next UTC day.
count-by-rank:
  settler: 6
  peasant: 8
  citizen: 10
  artisan: 12
  knight: 14
  baron: 16
  count: 18
  prince: 20
  caesar: 21

# Applied once when the daily board is assigned; existing goals keep their terms.
# Only repeatable crop harvests retain rank/rare target multipliers; discrete and composite tasks use authored caps.
scaling-by-rank:
  settler: {target-percent: 100, money-percent: 100, bonus-percent: 100, rare-tokens: 1}
  peasant: {target-percent: 115, money-percent: 120, bonus-percent: 110, rare-tokens: 1}
  citizen: {target-percent: 130, money-percent: 140, bonus-percent: 120, rare-tokens: 1}
  artisan: {target-percent: 150, money-percent: 160, bonus-percent: 130, rare-tokens: 1}
  knight: {target-percent: 175, money-percent: 190, bonus-percent: 140, rare-tokens: 1}
  baron: {target-percent: 200, money-percent: 220, bonus-percent: 150, rare-tokens: 2}
  count: {target-percent: 230, money-percent: 260, bonus-percent: 165, rare-tokens: 2}
  prince: {target-percent: 265, money-percent: 300, bonus-percent: 180, rare-tokens: 2}
  caesar: {target-percent: 300, money-percent: 350, bonus-percent: 200, rare-tokens: 3}

# Each quest also supports enabled: false. Flags affect new assignments.
features:
  ordinary: true
  chains: true
  alternatives: true
  collections: true
  checklists: true
  challenges: true
  contextual: true
  teamwork: false
  voting: true
  social-links: true
  replacements: true
tracking:
  enabled: true
  interval-seconds: 3
selection:
  # At most one account-link quest can enter a daily set; replacements never add them.
  social-chance-percent: 15
  focus-percent: 35
  history-days: 3
  max-per-family: 2
  advanced-per-day: 3
  replacements-per-day: 2

# Pool uses concrete successful actions, not weighted rank counters.
