name: ArcRanks
version: '${version}'
main: ru.ruscrafting.ranks.paper.ArcRanksPlugin
api-version: '1.21.11'
authors: [RusCrafting]
description: Cross-server rank progression and specializations
depend: [LuckPerms]
softdepend: [Vault, PlaceholderAPI, CMI, EliteMobs, zAuctionHouse, zAuctionHouseV3]
commands:
  rank:
    description: Open ranks and progression or inspect details
    aliases: [ranks, rang]
    usage: /rank [why|benefits|focus|contracts|perks|kit|admin]
    permission: arcranks.use
  rankup:
    description: Advance to the next permanent rank
    usage: /rankup
    permission: arcranks.rankup
permissions:
  arcranks.use:
    default: false
  arcranks.rankup:
    default: false
  arcranks.admin.inspect:
    default: op
  arcranks.admin.grant:
    default: op
  arcranks.admin.reload:
    default: op
  arcranks.admin.simulate:
    default: op
  arcranks.admin.analytics:
    default: op
  arcranks.admin.contract:
    default: op
