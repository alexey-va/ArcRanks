    header: '<prefix> <#fff0d8>Усиления ранга «<rank>»:</color>'
  focus:
    selected: |-
      <prefix> <#2bba43>Фокус: <path>.</color>
      <#8c8c8c>Он меняет только подсказки и подбор ежедневных заданий.</color>
      <#8c8c8c>Другие пути продолжают расти с обычной скоростью.</color>
    unknown: |-
      <prefix> <#ff9f0f>Неизвестный путь.</color>
      <#8c8c8c>farming, industry, trade</color>
      <#8c8c8c>exploration, building, community</color>
  contracts:
    accepted: |-
      <prefix> <#2bba43>Контракт принят: <path>.</color>
