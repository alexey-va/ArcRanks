    intro: |-
      <#e8dfd2>Ранг показывает ваш постоянный прогресс на сервере.</color>
      <#aaa49a>Чтобы повыситься, накопите активное время и выполните нужное число целей в любых путях развития. Выполненные требования не сгорают.</color>
    status: |-
      <#f4bd6a><bold>Сейчас</bold></color>
      <#e8dfd2>Ранг:</color> <#9bd48d><rank></color>
      <#e8dfd2>Фокус:</color> <#d7b486><focus></color>
      <#aaa49a>Фокус меняет только подсказки и предложения контрактов. Все шесть путей продолжают получать прогресс.</color>
    next: |-
      <#f4bd6a><bold>Следующая цель — <next></bold></color>
