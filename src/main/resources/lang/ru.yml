      <#aaa49a>Откройте «Пути развития», чтобы увидеть точные числа и действия для каждого пути.</color>
    top: |-
      <#9bd48d><bold>Высший постоянный ранг уже получен.</bold></color>
      <#aaa49a>Пути развития, контракты, усиления и недельные награды остаются доступны.</color>
    paths: '<#c4abff>Пути развития ›</color>'
    benefits: '<#c4abff>Ранги и привилегии ›</color>'
    contracts: '<#ffb277>Личные контракты ›</color>'
    perks: '<#c4abff>Усиления путей ›</color>'
    weekly-kit: '<#c4abff>Недельный набор ›</color>'
