prefix: '<#f4bd6a>Ранги</color> <#8c8c8c>•</color>'
features:
  contracts: 'Контракты'
  perks: 'Перки'
  weekly-kits: 'Еженедельные наборы'
commands:
  help: |-
    <prefix> <#fff0d8>/rank</color> <#8c8c8c>— ранги и развитие</color>
    <#f4bd6a>/rank why</color> <#8c8c8c>— что осталось до следующего ранга</color>
    <#f4bd6a>/rank benefits</color> <#8c8c8c>— текущие и будущие усиления</color>
    <#f4bd6a>/rank kit</color> <#8c8c8c>— еженедельный набор текущего ранга</color>
    <#f4bd6a>/rank focus [путь]</color> <#8c8c8c>— выбрать специализацию</color>
    <#f4bd6a>/rank contracts</color> <#8c8c8c>— личные цели недели</color>
    <#f4bd6a>/rank perks</color> <#8c8c8c>— усиления специализаций</color>
    <#f4bd6a>/rankup</color> <#8c8c8c>— повысить ранг</color>
  player-only: '<prefix> <#c42323>Эта команда доступна только в игре.</color>'
  no-permission: '<prefix> <#c42323>У вас нет прав на эту команду.</color>'
  feature-disabled: |-
    <prefix> <#f4bd6a>Функция «<feature>» сейчас отключена.</color>
    <#8c8c8c>Её может включить администратор.</color>
  loading: '<prefix> <#fff0d8>Собираю ваш прогресс…</color>'
  storage-unavailable: |-
    <prefix> <#c42323>Прогресс временно недоступен.</color>
    <#8c8c8c>Ничего не потеряно; попробуйте чуть позже.</color>
  shadow-mode: |-
    <prefix> <#ff9f0f>Повышение пока работает в режиме проверки.</color>
    <#8c8c8c>Прогресс уже считается.</color>
  rank-state:
    missing: |-
      <prefix> <#ff9f0f>Не удалось определить основной ранг.</color>
      <#8c8c8c>Обратитесь к администратору.</color>
    conflict: |-
      <prefix> <#c42323>Не удалось определить основной ранг.</color>
      <#8c8c8c>Обратитесь к администратору.</color>
    unknown: '<prefix> <#c42323>Не удалось обновить ранг.</color> <#8c8c8c>Попробуйте позже.</color>'
  why:
    ready: '<prefix> <#2bba43>Всё готово.</color> <#fff0d8>Можно повышаться до «<rank>».</color>'
    core: '<prefix> <#fff0d8>До «<rank>»:</color> <#f4bd6a>ещё <remaining> активной игры.</color>'
    paths: |-
      <prefix> <#fff0d8>До «<rank>»:</color> <#f4bd6a>закройте ещё <remaining> путей развития.</color>
      <#8c8c8c>Ближайший — <path>.</color>
    unavailable: |-
      <prefix> <#ff9f0f>Доступно <available> путей из нужных <required>.</color>
      <#8c8c8c>Прогресс сохранится.</color>
      <#8c8c8c>Администраторы уже видят проблему.</color>
    top: |-
      <prefix> <#f4bd6a>У вас высший постоянный ранг.</color>
      <#fff0d8>Продолжайте прокачивать специализации.</color>
  benefits:
    header: '<prefix> <#fff0d8>Усиления ранга «<rank>»:</color>'
  focus:
    selected: |-
      <prefix> <#2bba43>Фокус: <path>.</color>
      <#8c8c8c>Другие пути продолжают считаться.</color>
    unknown: |-
      <prefix> <#ff9f0f>Неизвестный путь.</color>
      <#8c8c8c>farming, industry, trade</color>
      <#8c8c8c>exploration, building, community</color>
  contracts:
    accepted: |-
      <prefix> <#2bba43>Контракт принят: <path>.</color>
      <#f4bd6a>Цель:</color> <#fff0d8>наберите <target> очков.</color>
      <#8c8c8c>Засчитывается:</color>
      <#fff0d8>  <action-first></color>
      <#fff0d8>  <action-second></color>
      <#fff0d8>  <action-third></color>
      <#f4bd6a>Награда:</color> <#2bba43>+<reward> к пути, <money> монет, <tokens> жет.</color>
      <#f4bd6a>Предмет:</color> <#2bba43><item-amount> × <item>.</color>
      <#8c8c8c>После выполнения откройте </color><#f4bd6a>/rank → «Контракты»</color><#8c8c8c>.</color>
      <#8c8c8c>Заберите готовую награду.</color>
    already-active: '<prefix> <#ff9f0f>Сначала завершите активный контракт.</color>'
    offer-unavailable: '<prefix> <#ff9f0f>Предложение уже изменилось.</color> <#8c8c8c>Обновите экран.</color>'
    cycle-complete: '<prefix> <#2bba43>Все контракты этой недели завершены.</color>'
    claimed: |-
      <prefix> <#2bba43>Контракт выполнен. Награда получена:</color>
      <#fff0d8>+<reward> к пути, <money> монет, <tokens> жет. и <item-amount> × <item>.</color>
    delivery-pending: |-
      <prefix> <#ff9f0f>Контракт закрыт, награда сохранена.</color>
      <#8c8c8c>Выдача повторится автоматически.</color>
    delivery-recovery: |-
      <prefix> <#c42323>Контракт закрыт, но выдачу нужно проверить.</color>
      <#8c8c8c>Сообщите администрации.</color>
    not-ready: '<prefix> <#ff9f0f>Цель контракта ещё не выполнена.</color>'
    already-claimed: '<prefix> <#8c8c8c>Эта награда уже получена.</color>'
    no-active: '<prefix> <#ff9f0f>Активного контракта нет.</color>'
    rerolled: '<prefix> <#2bba43>Предложения обновлены бесплатно.</color>'
    reroll-used: '<prefix> <#ff9f0f>Бесплатное обновление уже использовано.</color>'
    storage-unavailable: |-
      <prefix> <#c42323>Контракты временно недоступны.</color>
      <#8c8c8c>Ничего не потеряно.</color>
  perks:
    selected: '<prefix> <#2bba43>Перк «<perk>» выбран.</color>'
    already-selected: '<prefix> <#8c8c8c>Перк «<perk>» уже работает.</color>'
    removed: '<prefix> <#f4bd6a>Перк «<perk>» снят.</color>'
    not-selected: '<prefix> <#8c8c8c>Перк «<perk>» уже снят.</color>'
    locked: |-
      <prefix> <#ff9f0f>Перк «<perk>» пока закрыт.</color>
      <#8c8c8c>Он откроется с развитием пути.</color>
    full: '<prefix> <#ff9f0f>Обе ячейки заняты.</color> <#8c8c8c>Снимите другой перк.</color>'
    storage-unavailable: '<prefix> <#c42323>Перки временно недоступны.</color>'
  weekly-kit:
    claimed: |-
      <prefix> <#2bba43><bold>Недельный набор получен.</bold></color>
      <#8c8c8c>Следующий будет доступен в понедельник.</color>
    already-claimed: '<prefix> <#8c8c8c>Набор этой недели уже получен.</color>'
    delivery-pending: |-
      <prefix> <#ff9f0f>Набор уже обрабатывается.</color>
      <#8c8c8c>Если награда не появилась, сообщите администрации.</color>
    inventory-full: '<prefix> <#ff9f0f>Освободите минимум <required> яч. инвентаря.</color>'
    provider-rejected: '<prefix> <#c42323>CMI не выдал набор.</color> <#8c8c8c>Попробуйте ещё раз.</color>'
    storage-unavailable: '<prefix> <#c42323>Недельные наборы временно недоступны.</color>'
    admin-reset: |-
      <prefix> <#ff9f0f><player>: получение недельного набора сброшено.</color>
      <#8c8c8c>Уже выданные предметы не удалены.</color>
    admin-reset-delivering: |-
      <prefix> <#c42323><player>: выдача ещё идёт — сброс запрещён.</color>
      <#8c8c8c>Сначала проверьте результат доставки.</color>
    admin-reset-not-claimed: '<prefix> <#8c8c8c><player>: набор этой недели ещё не получен.</color>'
    admin-reset-storage-unavailable: '<prefix> <#c42323>Не удалось сбросить получение набора.</color>'
  promotion:
    success: |-
      <#f4bd6a><bold>✦ Новый ранг — <rank>! ✦</bold></color>
      <#fff0d8>Старые возможности остались.</color>
      <#fff0d8>Развитие стало глубже.</color>
    busy: '<prefix> <#ff9f0f>Повышение уже обрабатывается.</color>'
    retryable: |-
      <prefix> <#ff9f0f>Повышение сохранено, но не завершено.</color>
      <#8c8c8c>Повторите /rankup — операция продолжится безопасно.</color>
    not-eligible: '<prefix> <#ff9f0f>Условия ещё не выполнены.</color> <#8c8c8c>Введите /rank why.</color>'
  reload:
    success: '<prefix> <#2bba43>Настройки, ранги и тексты обновлены.</color>'
    no-changes: '<prefix> <#8c8c8c>Изменений в настройках не найдено.</color>'
    restart-required: |-
      <prefix> <#ff9f0f>Для этих настроек нужен перезапуск:</color>
      <#8c8c8c><paths></color>
    busy: '<prefix> <#ff9f0f>Обновление настроек уже выполняется.</color>'
    failure: |-
      <prefix> <#c42323>Не удалось обновить ArcRanks:</color>
      <#8c8c8c><reason></color>
  admin:
    inspect: '<prefix> <#fff0d8><player>:</color> <#f4bd6a><rank></color>, <#8c8c8c>следующий — <next>.</color>'
    grant-success: '<prefix> <#2bba43><player>: +<amount> к <metric>.</color>'
    grant-duplicate: |-
      <prefix> <#ff9f0f>Событие <event-id> уже применялось.</color>
      <#8c8c8c>Повторная награда не выдана.</color>
    grant-invalid: |-
      <prefix> <#ff9f0f>Формат:</color>
      <#fff0d8>/rank admin grant [игрок] [метрика]</color>
      <#fff0d8>[количество] [event-id]</color>
    simulate: '<prefix> <#fff0d8>Симуляция <player>:</color> <#f4bd6a><result></color>'
    analytics: |-
      <prefix> <#f4bd6a>Аналитика за <days> дней</color>
      <#fff0d8>Игроков: <players> • открыли меню: <passport></color>
      <#fff0d8>Контракты: <accepted> → <completed> • перки: <perks></color>
      <#fff0d8>Повышений: <promotions> • потеряно событий: <dropped></color>
    analytics-invalid: '<prefix> <#ff9f0f>Период: 7, 14 или 30 дней.</color>'
    contract-completed: |-
      <prefix> <#ff9f0f><player>: контракт завершён администратором.</color>
      <#8c8c8c>Награда ещё не выдана — заберите её обычным сундуком.</color>
    contract-already-ready: '<prefix> <#8c8c8c><player>: контракт уже готов к выдаче.</color>'
    contract-no-active: '<prefix> <#ff9f0f><player>: активного контракта нет.</color>'
    contract-invalid: |-
      <prefix> <#ff9f0f>Формат:</color>
      <#fff0d8>/rank admin contract complete [игрок]</color>
    advance-applied: |-
      <prefix> <#ff9f0f><player>: добавлено <amount> к ближайшему условию.</color>
      <#8c8c8c>Прогресс постоянный. Ранг выдаётся обычной кнопкой.</color>
    advance-duplicate: '<prefix> <#ff9f0f><player>: этот шаг уже применён.</color>'
    advance-ready: '<prefix> <#8c8c8c><player>: условия следующего ранга выполнены.</color>'
    advance-top: '<prefix> <#8c8c8c><player>: высший постоянный ранг уже достигнут.</color>'
    advance-invalid: |-
      <prefix> <#ff9f0f>Формат:</color>
      <#fff0d8>/rank admin advance [игрок]</color>
    kit-invalid: |-
      <prefix> <#ff9f0f>Формат:</color>
      <#fff0d8>/rank admin kit reset [игрок]</color>
