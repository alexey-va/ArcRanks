    contracts:
      name: '<italic:false><#f4bd6a><bold>Личные контракты</bold></color>'
      lore:
        - '<italic:false><#fff0d8>За неделю можно выполнить три контракта подряд.</color>'
        - '<italic:false><#8c8c8c>Сначала выберите одну задачу из трёх предложений.</color>'
        - '<italic:false><#8c8c8c>После выбора остальные два предложения исчезнут.</color>'
        - '<italic:false><#8c8c8c>Выполняйте действия, перечисленные на карточке задачи.</color>'
        - '<italic:false><#8c8c8c>Когда цель будет выполнена, нажмите сундук с наградой.</color>'
        - '<italic:false><#8c8c8c>Вы сразу получите прогресс пути, монеты, жетоны и предмет.</color>'
        - '<italic:false><#8c8c8c>После получения награды появится следующий контракт.</color>'
        - '<italic:false><#8c8c8c>Второй и третий контракты дают более ценные награды.</color>'
        - '<italic:false><#8c8c8c>После третьего новые задачи появятся в понедельник.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#8c8c8c>[</color><#2bba43>▶</color><#8c8c8c>]</color> <#2bba43>ЛКМ</color><#fff0d8> — открыть контракты</color>'
    paths:
      name: '<italic:false><#f4bd6a><bold>Пути развития</bold></color>'
      lore:
        - '<italic:false><#fff0d8>Пути — это шесть направлений постоянного прогресса.</color>'
        - '<italic:false><#8c8c8c>Каждый растёт от своих действий: урожая, производства, торговли,</color>'
        - '<italic:false><#8c8c8c>путешествий, строительства или общения в чате.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#f4bd6a><bold>Зачем развивать пути:</bold></color>'
        - '<italic:false><#fff0d8>Чтобы открыть ранг «<next-rank>», выполните цели <required-paths> путей из 6.</color>'
        - '<italic:false><#8c8c8c>Сейчас выполнено: <completed-paths>/<required-paths>.</color>'
        - '<italic:false><#8c8c8c>• Поднимайте ступени путей — открывайте пассивные усиления.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#8c8c8c>Каждый путь растёт, когда вы выполняете подходящие для него действия.</color>'
        - '<italic:false><#8c8c8c>Фокус меняет только подсказки и предложения контрактов.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#8c8c8c>[</color><#2bba43>▶</color><#8c8c8c>]</color> <#2bba43>ЛКМ</color><#fff0d8> — открыть пути</color>'
      top-lore:
        - '<italic:false><#fff0d8>Пути — это шесть направлений постоянного прогресса.</color>'
        - '<italic:false><#8c8c8c>Каждый растёт от своих действий: урожая, производства, торговли,</color>'
        - '<italic:false><#8c8c8c>путешествий, строительства или общения в чате.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#f4bd6a><bold>Зачем развивать пути:</bold></color>'
        - '<italic:false><#2bba43>Высший постоянный ранг уже открыт.</color>'
        - '<italic:false><#8c8c8c>Поднимайте ступени путей, чтобы открывать пассивные усиления.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#8c8c8c>Каждый путь растёт, когда вы выполняете подходящие для него действия.</color>'
        - '<italic:false><#8c8c8c>Фокус меняет только подсказки и предложения контрактов.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#8c8c8c>[</color><#2bba43>▶</color><#8c8c8c>]</color> <#2bba43>ЛКМ</color><#fff0d8> — открыть пути</color>'
    perks:
      name: '<italic:false><#f4bd6a><bold>Усиления путей</bold></color>'
      lore:
        - '<italic:false><#fff0d8>Усиление — это пассивный бонус, который работает постоянно.</color>'
        - '<italic:false><#8c8c8c>Например, оно может увеличить опыт, добычу или награду.</color>'
        - '<italic:false><#8c8c8c>Новые усиления открываются на ступенях пути I, II и III.</color>'
        - '<italic:false><#8c8c8c>Одновременно работают не больше двух усилений.</color>'
        - '<italic:false><#8c8c8c>Их можно бесплатно менять или снимать в любой момент.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#8c8c8c>[</color><#2bba43>▶</color><#8c8c8c>]</color> <#2bba43>ЛКМ</color><#fff0d8> — выбрать усиления</color>'
    weekly-kit:
      name: '<italic:false><#f4bd6a><bold>Недельный набор</bold></color>'
      lore:
        - '<italic:false><#fff0d8>Раз в неделю вы можете бесплатно получить набор своего ранга.</color>'
        - '<italic:false><#8c8c8c>Чем выше ранг, тем ценнее содержимое набора.</color>'
