      <#e8dfd2>Ступень пути:</color> <#d7b486><mastery></color> <#aaa49a>·</color> <#e8dfd2>Состояние:</color> <state>
    focus-explanation: |-
      <#f4bd6a><bold>Что такое фокус</bold></color>
      <#aaa49a>Фокус не ускоряет и не останавливает прогресс. Он говорит меню, какой путь показывать первым в подсказках, и повышает шанс получить контракт по этому пути.</color>
    select-focus: '<#9bd48d>Выбрать как фокус</color>'
    select-focus-tooltip: '<#aaa49a>Подсказки и предложения контрактов будут чаще вести к этому пути. Остальные пути продолжат расти.</color>'
    all: '<#aaa49a>‹ Назад</color>'
    saving: '<#e8dfd2>Сохраняю новый фокус и перечитываю ваш прогресс…</color>'
    state-unavailable: '<#ffad52>источник прогресса сейчас недоступен</color>'
    state-focus: '<#f4bd6a>выбран как фокус</color>'
    state-complete: '<#9bd48d>условие следующего ранга выполнено</color>'
    state-progress: '<#aaa49a>условие ещё выполняется</color>'
  contracts:
    title: '<#ffb277><bold>Личные контракты</bold></color>'
    intro: |-
      <#e8dfd2>Контракт — это конкретное задание на неделю с отдельной наградой.</color>
      <#aaa49a>Сначала выберите одно предложение. Затем выполните перечисленные действия, вернитесь сюда и заберите награду. Одновременно активен только один контракт.</color>
    status: |-
      <#f4bd6a><bold>Недельный цикл: <period></bold></color>
      <#e8dfd2>Получено отметок:</color> <#9bd48d><stamps></color><#aaa49a>/3</color>
      <#aaa49a>Каждая полученная награда даёт одну отметку. Три отметки означают, что все контракты недели завершены. Осталось: <remaining>.</color>
    offer: |-
      <#f4bd6a><bold>Предложение <number>: <path></bold></color>
      <#e8dfd2>Ваша задача:</color> набрать <#d7b486><target> очков</color> этого пути после принятия контракта.
      <#e8dfd2>Награда:</color> <#9bd48d>+<reward> к пути, <money> монет, <tokens> жет. и <item-amount> × <item></color>
    active: |-
      <#f4bd6a><bold>Активный контракт: <path></bold></color>
      <#e8dfd2>Нужно:</color> <#d7b486><target></color> <#aaa49a>·</color> <#e8dfd2>сделано:</color> <#9bd48d><current></color> <#aaa49a>·</color> <#e8dfd2>осталось:</color> <#f4bd6a><remaining></color>
      <#9bd48d><bar></color>
      <#e8dfd2>После выполнения нажмите «Забрать награду».</color>
      <#e8dfd2>Награда:</color> <#9bd48d>+<reward> к пути, <money> монет, <tokens> жет. и <item-amount> × <item></color>
    active-ready: |-
      <#9bd48d><bold>Контракт выполнен: <path></bold></color>
      <#e8dfd2>Цель <target> достигнута. Награда ещё не выдана.</color>
      <#9bd48d><bar></color>
      <#e8dfd2>Нажмите «Забрать награду», чтобы получить +<reward> к пути, <money> монет, <tokens> жет. и <item-amount> × <item>.</color>
    counts: '<#f4bd6a><bold>Какие действия засчитываются</bold></color>'
    accept: '<#9bd48d>Принять предложение <number></color>'
    accept-tooltip: '<#aaa49a>После принятия начнёт считаться прогресс только этого задания.</color>'
    claim: '<#9bd48d><bold>Забрать награду</bold></color>'
    claim-tooltip: '<#e8dfd2>Выдать прогресс пути, монеты, жетоны и предмет; затем добавить недельную отметку.</color>'
    reroll: '<#d7b486>Бесплатно заменить предложения</color>'
    reroll-tooltip: '<#aaa49a>Можно использовать один раз за неделю, пока контракт не принят.</color>'
    complete: |-
      <#9bd48d><bold>Все три контракта этой недели завершены.</bold></color>
      <#aaa49a>Новые предложения появятся в следующем недельном цикле.</color>
    loading: '<#e8dfd2>Загружаю недельные предложения, активный контракт и полученные отметки…</color>'
    saving: '<#e8dfd2>Проверяю актуальное состояние контракта и выполняю действие…</color>'
  perks:
    title: '<#c4abff><bold>Усиления путей</bold></color>'
    intro: |-
      <#e8dfd2>Усиления — это два постоянных пассивных эффекта, которые вы выбираете сами.</color>
      <#aaa49a>Они открываются за ступени путей. Выберите ячейку, затем путь и нужный эффект. Новое усиление в занятой ячейке заменит старое.</color>
    slot-empty: '<#e8dfd2>Ячейка <slot>:</color> <#aaa49a>пусто — эффект не выбран.</color>'
    slot-active: '<#e8dfd2>Ячейка <slot>:</color> <#9bd48d><perk></color> <#aaa49a>— <description></color>'
    choose-slot: '<#c4a7e7>Настроить ячейку <slot> ›</color>'
    slot-title: '<#c4abff><bold>Усиление: ячейка <slot></bold></color>'
    slot-intro: '<#e8dfd2>Выберите путь. Затем увидите все три эффекта, условие открытия и сможете назначить один из них в ячейку <slot>.</color>'
    path-intro: |-
      <#f4bd6a><bold><path></bold></color>
      <#e8dfd2>Ваша ступень:</color> <#d7b486><mastery></color> <#aaa49a>·</color> <#e8dfd2>настраивается ячейка:</color> <#c4abff><slot></color>
    card: |-
      <#f4bd6a><bold><number>. <perk></bold></color> <#aaa49a>— <state></color>
      <#e8dfd2><description></color>
      <#aaa49a>Требуется ступень пути: <required>.</color>
    state-active: '<#9bd48d>сейчас работает</color>'
    state-locked: '<#aaa49a>пока закрыто</color>'
    state-available: '<#d7b486>можно выбрать</color>'
    path: '<#c4a7e7><path> ›</color>'
    select: '<#ffffff>○ <perk></color>'
    disable: '<#9bd48d>✔ <perk></color>'
    unavailable: '<#aaa49a>[Недоступно] <perk></color>'
    unavailable-tooltip: '<#aaa49a>Нужна ступень пути: <required>. Сейчас: <current>.</color>'
    saving: '<#e8dfd2>Проверяю ступень пути и сохраняю выбранное усиление…</color>'
  weekly-kit:
    title: '<#c4abff><bold>Недельный набор</bold></color>'
    intro: |-
      <#e8dfd2>Раз в неделю ваш текущий ранг даёт отдельный набор предметов.</color>
      <#aaa49a>Состав набора растёт вместе с рангом. Получение сбрасывается каждый понедельник.</color>
    status: |-
      <#e8dfd2>Набор ранга:</color> <#f4bd6a><rank></color>
      <#e8dfd2>Состояние:</color> <state>
      <#aaa49a>Перед получением освободите минимум <required> яч. основного инвентаря.</color>
    state:
      available: '<#9bd48d>можно получить сейчас</color>'
      delivering: '<#f4bd6a>выдача уже обрабатывается</color>'
      claimed: '<#aaa49a>на этой неделе уже получен</color>'
    claim: '<#9bd48d><bold>Получить набор</bold></color>'
    claim-tooltip: '<#e8dfd2>Выдать перечисленные предметы и отметить набор полученным до следующего понедельника.</color>'
    loading: '<#e8dfd2>Проверяю ваш текущий ранг и получение набора на этой неделе…</color>'
    claiming: '<#e8dfd2>Проверяю место в инвентаре и выдаю недельный набор…</color>'
    saving: '<#e8dfd2>Проверяю состояние выдачи и выполняю административный сброс…</color>'
  admin:
    advance: '<#ffad52><bold>АДМИН: закрыть ближайшее условие</bold></color>'
    advance-tooltip: '<#e8dfd2>Добавить ровно столько прогресса, сколько не хватает до ближайшего условия. Ранг автоматически не выдаётся.</color>'
    contract-complete: '<#ffad52><bold>АДМИН: завершить контракт</bold></color>'
    contract-complete-tooltip: '<#e8dfd2>Пометить активный контракт выполненным. Награду после этого нужно забрать обычной кнопкой.</color>'
    kit-reset: '<#ffad52><bold>АДМИН: сбросить получение</bold></color>'
    kit-reset-tooltip: '<#e8dfd2>Разрешить получить набор этой недели повторно. Уже выданные предметы не удаляются.</color>'
    analytics: '<#ffad52><bold>АДМИН: аналитика рангов</bold></color>'
    analytics-button: '<#c4abff>Аналитика ›</color>'
    analytics-tooltip: '<#e8dfd2>Показать использование меню, контрактов, усилений и повышений.</color>'
    working: '<#e8dfd2>Перечитываю прогресс и закрываю ближайшее условие…</color>'
    analytics-loading: '<#e8dfd2>Собираю агрегированную статистику рангов…</color>'
    analytics-title: '<#ffad52><bold>АДМИН: аналитика рангов</bold></color>'
    analytics-body: |-
      <#f4bd6a><bold>Период: <days> дней</bold></color>
      <#e8dfd2>Уникальных игроков:</color> <players>
      <#e8dfd2>Открыли меню:</color> <passport>
      <#e8dfd2>Приняли контракты:</color> <accepted> <#aaa49a>·</color> <#e8dfd2>завершили:</color> <completed>
      <#e8dfd2>Выбрали усиление:</color> <perks> <#aaa49a>·</color> <#e8dfd2>получили новый ранг:</color> <promotions>
      <#e8dfd2>Потеряно событий телеметрии:</color> <dropped>
    analytics-window: '<#aaa49a><days> дней</color>'
