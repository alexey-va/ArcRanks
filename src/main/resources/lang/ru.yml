prefix: '<#f4bd6a>Ранги</color> <#8c8c8c>•</color>'
features:
  contracts: 'Контракты'
  perks: 'Усиления путей'
  weekly-kits: 'Еженедельные наборы'
commands:
  help: |-
    <prefix> <#fff0d8>/rank</color> <#8c8c8c>— ранги и развитие</color>
    <#f4bd6a>/rank dialog</color> <#8c8c8c>— открыть подробную диалоговую версию меню</color>
    <#f4bd6a>/rank why</color> <#8c8c8c>— что осталось до следующего ранга</color>
    <#f4bd6a>/rank benefits</color> <#8c8c8c>— текущие и будущие усиления</color>
    <#f4bd6a>/rank kit</color> <#8c8c8c>— еженедельный набор текущего ранга</color>
    <#f4bd6a>/rank focus [путь]</color> <#8c8c8c>— подсказки и контракты по пути</color>
    <#f4bd6a>/rank contracts</color> <#8c8c8c>— личные цели недели</color>
    <#f4bd6a>/rank perks</color> <#8c8c8c>— выбрать два пассивных усиления</color>
    <#f4bd6a>/rankup</color> <#8c8c8c>— повысить ранг</color>
  player-only: '<prefix> <#c42323>Эта команда доступна только в игре.</color>'
  no-permission: '<prefix> <#c42323>У вас нет прав на эту команду.</color>'
  feature-disabled: |-
    <prefix> <#f4bd6a>Функция «<feature>» сейчас отключена.</color>
    <#8c8c8c>Её может включить администратор.</color>
  loading: '<prefix> <#fff0d8>Собираю ваш прогресс…</color>'
  storage-unavailable: |-
    <prefix> <#c42323>Прогресс временно недоступен.</color>
    <#8c8c8c>Ничего не потеряно; попробуйте чуть позже.</color>
  shadow-mode: |-
    <prefix> <#ff9f0f>Повышение пока работает в режиме проверки.</color>
    <#8c8c8c>Прогресс уже считается.</color>
  rank-state:
    missing: |-
      <prefix> <#ff9f0f>Не удалось определить основной ранг.</color>
      <#8c8c8c>Обратитесь к администратору.</color>
    conflict: |-
      <prefix> <#c42323>Не удалось определить основной ранг.</color>
      <#8c8c8c>Обратитесь к администратору.</color>
    unknown: '<prefix> <#c42323>Не удалось обновить ранг.</color> <#8c8c8c>Попробуйте позже.</color>'
  why:
    ready: '<prefix> <#2bba43>Всё готово.</color> <#fff0d8>Можно повышаться до «<rank>».</color>'
    core: '<prefix> <#fff0d8>До «<rank>»:</color> <#f4bd6a>ещё <remaining> активной игры.</color>'
    paths: |-
      <prefix> <#fff0d8>До «<rank>»:</color> <#f4bd6a>закройте ещё <remaining> путей развития.</color>
      <#8c8c8c>Ближайший — <path>.</color>
    unavailable: |-
      <prefix> <#ff9f0f>Доступно <available> путей из нужных <required>.</color>
      <#8c8c8c>Прогресс сохранится.</color>
      <#8c8c8c>Администраторы уже видят проблему.</color>
    top: |-
      <prefix> <#f4bd6a>У вас высший постоянный ранг.</color>
      <#fff0d8>Продолжайте развивать пути и открывать их усиления.</color>
  benefits:
    header: '<prefix> <#fff0d8>Усиления ранга «<rank>»:</color>'
  focus:
    selected: |-
      <prefix> <#2bba43>Фокус: <path>.</color>
      <#8c8c8c>Он меняет только подсказки и предложения контрактов.</color>
      <#8c8c8c>Другие пути продолжают расти с обычной скоростью.</color>
    unknown: |-
      <prefix> <#ff9f0f>Неизвестный путь.</color>
      <#8c8c8c>farming, industry, trade</color>
      <#8c8c8c>exploration, building, community</color>
  contracts:
    accepted: |-
      <prefix> <#2bba43>Контракт принят: <path>.</color>
      <#f4bd6a>Цель:</color> <#fff0d8>наберите <target> очков.</color>
      <#8c8c8c>Засчитывается:</color>
      <#fff0d8>  <action-first></color>
      <#fff0d8>  <action-second></color>
      <#fff0d8>  <action-third></color>
      <#f4bd6a>Награда:</color> <#2bba43>+<reward> к пути, <money> монет, <tokens> жет.</color>
      <#f4bd6a>Предмет:</color> <#2bba43><item-amount> × <item>.</color>
      <#8c8c8c>После выполнения откройте </color><#f4bd6a>/rank → «Контракты»</color><#8c8c8c>.</color>
      <#8c8c8c>Заберите готовую награду.</color>
    already-active: '<prefix> <#ff9f0f>Сначала завершите активный контракт.</color>'
    offer-unavailable: '<prefix> <#ff9f0f>Предложение уже изменилось.</color> <#8c8c8c>Обновите экран.</color>'
    cycle-complete: '<prefix> <#2bba43>Все контракты этой недели завершены.</color>'
    claimed: |-
      <prefix> <#2bba43>Контракт выполнен. Награда получена:</color>
      <#fff0d8>+<reward> к пути, <money> монет, <tokens> жет. и <item-amount> × <item>.</color>
    delivery-pending: |-
      <prefix> <#ff9f0f>Контракт закрыт, награда сохранена.</color>
      <#8c8c8c>Выдача повторится автоматически.</color>
    delivery-recovery: |-
      <prefix> <#c42323>Контракт закрыт, но выдачу нужно проверить.</color>
      <#8c8c8c>Сообщите администрации.</color>
    not-ready: '<prefix> <#ff9f0f>Цель контракта ещё не выполнена.</color>'
    already-claimed: '<prefix> <#8c8c8c>Эта награда уже получена.</color>'
    no-active: '<prefix> <#ff9f0f>Активного контракта нет.</color>'
    rerolled: '<prefix> <#2bba43>Предложения обновлены бесплатно.</color>'
    reroll-used: '<prefix> <#ff9f0f>Бесплатное обновление уже использовано.</color>'
    storage-unavailable: |-
      <prefix> <#c42323>Контракты временно недоступны.</color>
      <#8c8c8c>Ничего не потеряно.</color>
  perks:
    selected: '<prefix> <#2bba43>Усиление «<perk>» включено.</color>'
    already-selected: '<prefix> <#8c8c8c>Усиление «<perk>» уже работает.</color>'
    removed: '<prefix> <#f4bd6a>Усиление «<perk>» выключено.</color>'
    not-selected: '<prefix> <#8c8c8c>Усиление «<perk>» уже выключено.</color>'
    locked: |-
      <prefix> <#ff9f0f>Усиление «<perk>» пока закрыто.</color>
      <#8c8c8c>Оно откроется, когда вы повысите ступень этого пути.</color>
    full: |-
      <prefix> <#ff9f0f>Обе ячейки усилений заняты.</color>
      <#8c8c8c>Сначала выключите одно из них.</color>
    storage-unavailable: '<prefix> <#c42323>Усиления временно недоступны.</color>'
  weekly-kit:
    claimed: |-
      <prefix> <#2bba43><bold>Недельный набор получен.</bold></color>
      <#8c8c8c>Следующий будет доступен в понедельник.</color>
    already-claimed: '<prefix> <#8c8c8c>Набор этой недели уже получен.</color>'
    delivery-pending: |-
      <prefix> <#ff9f0f>Набор уже обрабатывается.</color>
      <#8c8c8c>Если награда не появилась, сообщите администрации.</color>
    inventory-full: '<prefix> <#ff9f0f>Освободите минимум <required> яч. инвентаря.</color>'
    provider-rejected: '<prefix> <#c42323>CMI не выдал набор.</color> <#8c8c8c>Попробуйте ещё раз.</color>'
    storage-unavailable: '<prefix> <#c42323>Недельные наборы временно недоступны.</color>'
    admin-reset: |-
      <prefix> <#ff9f0f><player>: получение недельного набора сброшено.</color>
      <#8c8c8c>Уже выданные предметы не удалены.</color>
    admin-reset-delivering: |-
      <prefix> <#c42323><player>: выдача ещё идёт — сброс запрещён.</color>
      <#8c8c8c>Сначала проверьте результат доставки.</color>
    admin-reset-not-claimed: '<prefix> <#8c8c8c><player>: набор этой недели ещё не получен.</color>'
    admin-reset-storage-unavailable: '<prefix> <#c42323>Не удалось сбросить получение набора.</color>'
  promotion:
    success: |-
      <#f4bd6a><bold>✦ Новый ранг — <rank>! ✦</bold></color>
      <#fff0d8>Старые возможности остались.</color>
      <#fff0d8>Развитие стало глубже.</color>
    busy: '<prefix> <#ff9f0f>Повышение уже обрабатывается.</color>'
    retryable: |-
      <prefix> <#ff9f0f>Повышение сохранено, но не завершено.</color>
      <#8c8c8c>Повторите /rankup — операция продолжится безопасно.</color>
    not-eligible: '<prefix> <#ff9f0f>Условия ещё не выполнены.</color> <#8c8c8c>Введите /rank why.</color>'
  reload:
    success: '<prefix> <#2bba43>Настройки, ранги и тексты обновлены.</color>'
    no-changes: '<prefix> <#8c8c8c>Изменений в настройках не найдено.</color>'
    restart-required: |-
      <prefix> <#ff9f0f>Для этих настроек нужен перезапуск:</color>
      <#8c8c8c><paths></color>
    busy: '<prefix> <#ff9f0f>Обновление настроек уже выполняется.</color>'
    failure: |-
      <prefix> <#c42323>Не удалось обновить ArcRanks:</color>
      <#8c8c8c><reason></color>
  admin:
    inspect: '<prefix> <#fff0d8><player>:</color> <#f4bd6a><rank></color>, <#8c8c8c>следующий — <next>.</color>'
    grant-success: '<prefix> <#2bba43><player>: +<amount> к <metric>.</color>'
    grant-duplicate: |-
      <prefix> <#ff9f0f>Событие <event-id> уже применялось.</color>
      <#8c8c8c>Повторная награда не выдана.</color>
    grant-invalid: |-
      <prefix> <#ff9f0f>Формат:</color>
      <#fff0d8>/rank admin grant [игрок] [метрика]</color>
      <#fff0d8>[количество] [event-id]</color>
    simulate: '<prefix> <#fff0d8>Симуляция <player>:</color> <#f4bd6a><result></color>'
    analytics: |-
      <prefix> <#f4bd6a>Аналитика за <days> дней</color>
      <#fff0d8>Игроков: <players> • открыли меню: <passport></color>
      <#fff0d8>Контракты: <accepted> → <completed> • перки: <perks></color>
      <#fff0d8>Повышений: <promotions> • потеряно событий: <dropped></color>
    analytics-invalid: '<prefix> <#ff9f0f>Период: 7, 14 или 30 дней.</color>'
    contract-completed: |-
      <prefix> <#ff9f0f><player>: контракт завершён администратором.</color>
      <#8c8c8c>Награда ещё не выдана — заберите её обычным сундуком.</color>
    contract-already-ready: '<prefix> <#8c8c8c><player>: контракт уже готов к выдаче.</color>'
    contract-no-active: '<prefix> <#ff9f0f><player>: активного контракта нет.</color>'
    contract-invalid: |-
      <prefix> <#ff9f0f>Формат:</color>
      <#fff0d8>/rank admin contract complete [игрок]</color>
    advance-applied: |-
      <prefix> <#ff9f0f><player>: добавлено <amount> к ближайшему условию.</color>
      <#8c8c8c>Прогресс постоянный. Ранг выдаётся обычной кнопкой.</color>
    advance-duplicate: '<prefix> <#ff9f0f><player>: этот шаг уже применён.</color>'
    advance-ready: '<prefix> <#8c8c8c><player>: условия следующего ранга выполнены.</color>'
    advance-top: '<prefix> <#8c8c8c><player>: высший постоянный ранг уже достигнут.</color>'
    advance-invalid: |-
      <prefix> <#ff9f0f>Формат:</color>
      <#fff0d8>/rank admin advance [игрок]</color>
    kit-invalid: |-
      <prefix> <#ff9f0f>Формат:</color>
      <#fff0d8>/rank admin kit reset [игрок]</color>
mastery:
  none: 'Без ступени'
  i: 'I'
  ii: 'II'
  iii: 'III'
duration:
  minutes: '<minutes> мин.'
  hours: '<hours> ч.'
  hours-minutes: '<hours> ч. <minutes> мин.'
  days: '<days> дн.'
  days-hours: '<days> дн. <hours> ч.'
  days-minutes: '<days> дн. <minutes> мин.'
  days-hours-minutes: '<days> дн. <hours> ч. <minutes> мин.'
dialogs:
  common:
    none: 'нет'
    back: '<#9db0ba>Назад</color>'
    refresh: '<#4dd8f0>Обновить данные</color>'
    retry: '<#ffca55>Попробовать снова</color>'
    help: '<#9db0ba>Назад в помощь</color>'
    help-tooltip: '<#9db0ba>Вернуться в главное диалоговое меню /help.</color>'
    open-tooltip: '<#9db0ba>Открыть этот раздел диалогового меню.</color>'
    loading-title: '<#ffca55><bold>Ранги и развитие</bold></color>'
    loading: '<#f5fbff>Загружаю ваш текущий ранг, прогресс и доступные действия…</color>'
    error-title: '<#ffad52><bold>Данные временно недоступны</bold></color>'
    error: |-
      <#f5fbff>Не удалось получить актуальные данные о рангах.</color>
      <#9db0ba>Ваш прогресс не потерян. Попробуйте ещё раз через несколько секунд.</color>
  root:
    title: '<#ffca55><bold>Ранги и развитие</bold></color>'
    intro: |-
      <#f5fbff>Ранг показывает ваш постоянный прогресс на сервере.</color>
      <#9db0ba>Чтобы повыситься, накопите активное время и выполните нужное число целей в любых путях развития. Выполненные требования не сгорают.</color>
    status: |-
      <#ffca55><bold>Сейчас</bold></color>
      <#f5fbff>Ранг:</color> <#7fe38b><rank></color>
      <#f5fbff>Фокус:</color> <#4dd8f0><focus></color>
      <#9db0ba>Фокус меняет только подсказки и предложения контрактов. Все шесть путей продолжают получать прогресс.</color>
    next: |-
      <#ffca55><bold>Следующая цель — <next></bold></color>
      <#f5fbff><recommendation></color>
      <#9db0ba>Откройте «Пути развития», чтобы увидеть точные числа и действия для каждого пути.</color>
    top: |-
      <#7fe38b><bold>Высший постоянный ранг уже получен.</bold></color>
      <#9db0ba>Пути развития, контракты, усиления и недельные награды остаются доступны.</color>
    paths: '<#4dd8f0>Пути развития</color>'
    benefits: '<#ffca55>Ранги и привилегии</color>'
    contracts: '<#7fe38b>Личные контракты</color>'
    perks: '<#4f8cff>Усиления путей</color>'
    weekly-kit: '<#ffad52>Недельный набор</color>'
    promote: '<#7fe38b><bold>Повысить ранг</bold></color>'
    promote-tooltip: '<#f5fbff>Все условия выполнены. Нажмите, чтобы получить следующий постоянный ранг.</color>'
    promoting: '<#f5fbff>Проверяю условия и выдаю следующий постоянный ранг…</color>'
  benefits:
    title: '<#ffca55><bold>Ранги и привилегии</bold></color>'
    intro: |-
      <#f5fbff>Каждый новый ранг навсегда добавляет возможности сервера.</color>
      <#9db0ba>Откройте любой ранг: внутри перечислены точные лимиты, функции, команды и награды.</color>
    completed: '<#7fe38b>Получено:</color>'
    current: '<#ffca55>Ваш ранг:</color>'
    next: '<#4dd8f0>Следующий:</color>'
    locked: '<#9db0ba>Позже:</color>'
    open-tooltip: '<#9db0ba>Показать полный список возможностей этого ранга.</color>'
    state-completed: '<#7fe38b>уже получен</color>'
    state-current: '<#ffca55>ваш текущий ранг</color>'
    state-next: '<#4dd8f0>следующий доступный ранг</color>'
    state-locked: '<#9db0ba>откроется позже</color>'
    detail: |-
      <#ffca55><bold><rank></bold></color> <#9db0ba>— <state></color>
      <#f5fbff>Что даёт этот ранг:</color>
    all: '<#9db0ba>К списку рангов</color>'
  paths:
    title: '<#4dd8f0><bold>Пути развития</bold></color>'
    intro: |-
      <#f5fbff>Путь — это отдельное направление вашего игрового прогресса: хозяйство, производство, торговля, исследование, строительство или сообщество.</color>
      <#9db0ba>Для следующего ранга не нужно закрывать все шесть. Достаточно выполнить указанное число любых доступных путей.</color>
    status: |-
      <#ffca55><bold>До следующего ранга</bold></color>
      <#f5fbff>Выполнено путей:</color> <#7fe38b><completed></color><#9db0ba>/</color><#f5fbff><required></color>
      <#f5fbff>Текущий фокус:</color> <#4dd8f0><focus></color>
    marker-focus: '<#ffca55>★ Фокус</color> —'
    marker-complete: '<#7fe38b>◆ Выполнено</color> —'
    marker-unavailable: '<#ffad52>Недоступно</color> —'
    marker-progress: '<#9db0ba>В процессе</color> —'
    detail: |-
      <#ffca55><bold><path></bold></color> <#9db0ba>— <summary></color>
      <#f5fbff><details></color>

      <#ffca55><bold>Что именно делать</bold></color>
    progress: |-
      <#ffca55><bold>Ваш прогресс</bold></color>
      <#7fe38b><bar></color> <#f5fbff><current></color><#9db0ba>/</color><#f5fbff><target></color>
      <#f5fbff>Ступень пути:</color> <#4dd8f0><mastery></color> <#9db0ba>·</color> <#f5fbff>Состояние:</color> <state>
    focus-explanation: |-
      <#ffca55><bold>Что такое фокус</bold></color>
      <#9db0ba>Фокус не ускоряет и не останавливает прогресс. Он говорит меню, какой путь показывать первым в подсказках, и повышает шанс получить контракт по этому пути.</color>
    select-focus: '<#ffca55>Выбрать как фокус</color>'
    select-focus-tooltip: '<#9db0ba>Подсказки и предложения контрактов будут чаще вести к этому пути. Остальные пути продолжат расти.</color>'
    all: '<#9db0ba>Ко всем путям</color>'
    saving: '<#f5fbff>Сохраняю новый фокус и перечитываю ваш прогресс…</color>'
    state-unavailable: '<#ffad52>источник прогресса сейчас недоступен</color>'
    state-focus: '<#ffca55>выбран как фокус</color>'
    state-complete: '<#7fe38b>условие следующего ранга выполнено</color>'
    state-progress: '<#9db0ba>условие ещё выполняется</color>'
  contracts:
    title: '<#7fe38b><bold>Личные контракты</bold></color>'
    intro: |-
      <#f5fbff>Контракт — это конкретное задание на неделю с отдельной наградой.</color>
      <#9db0ba>Сначала выберите одно предложение. Затем выполните перечисленные действия, вернитесь сюда и заберите награду. Одновременно активен только один контракт.</color>
    status: |-
      <#ffca55><bold>Недельный цикл: <period></bold></color>
      <#f5fbff>Получено отметок:</color> <#7fe38b><stamps></color><#9db0ba>/3</color>
      <#9db0ba>Каждая полученная награда даёт одну отметку. Три отметки означают, что все контракты недели завершены. Осталось: <remaining>.</color>
    offer: |-
      <#ffca55><bold>Предложение <number>: <path></bold></color>
      <#f5fbff>Ваша задача:</color> набрать <#4dd8f0><target> очков</color> этого пути после принятия контракта.
