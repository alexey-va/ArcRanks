    intro: |-
      <#e8dfd2>Путь — это отдельное направление вашего игрового прогресса: хозяйство, производство, торговля, исследование, строительство или сообщество.</color>
      <#aaa49a>Для следующего ранга не нужно закрывать все шесть. Достаточно выполнить указанное число любых доступных путей.</color>
