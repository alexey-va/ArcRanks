prefix: '<#d9864f>Ранги</color> <#8d7768>•</color>'
commands:
  help: |-
    <prefix> <#fff0d8>/rank</color> <#8d7768>— ранги и развитие</color>
    <#d9864f>/rank why</color> <#8d7768>— что осталось до следующего ранга</color>
    <#d9864f>/rank benefits</color> <#8d7768>— текущие и будущие усиления</color>
    <#d9864f>/rank kit</color> <#8d7768>— еженедельный набор текущего ранга</color>
    <#d9864f>/rank focus [путь]</color> <#8d7768>— выбрать специализацию</color>
    <#d9864f>/rank contracts</color> <#8d7768>— личные цели недели</color>
    <#d9864f>/rank perks</color> <#8d7768>— усиления специализаций</color>
    <#d9864f>/rankup</color> <#8d7768>— повысить ранг</color>
  player-only: '<prefix> <#c95d4b>Эта команда доступна только в игре.</color>'
  no-permission: '<prefix> <#c95d4b>У вас нет прав на эту команду.</color>'
  loading: '<prefix> <#fff0d8>Собираю ваш прогресс…</color>'
  storage-unavailable: |-
    <prefix> <#c95d4b>Прогресс временно недоступен.</color>
    <#8d7768>Ничего не потеряно; попробуйте чуть позже.</color>
  shadow-mode: |-
    <prefix> <#e6a348>Повышение пока работает в режиме проверки.</color>
    <#8d7768>Прогресс уже считается.</color>
  rank-state:
    missing: |-
      <prefix> <#e6a348>Не удалось определить основной ранг.</color>
      <#8d7768>Обратитесь к администратору.</color>
    conflict: |-
      <prefix> <#c95d4b>Не удалось определить основной ранг.</color>
      <#8d7768>Обратитесь к администратору.</color>
    unknown: '<prefix> <#c95d4b>Не удалось обновить ранг.</color> <#8d7768>Попробуйте позже.</color>'
  why:
    ready: '<prefix> <#63ad6b>Всё готово.</color> <#fff0d8>Можно повышаться до «<rank>».</color>'
    core: '<prefix> <#fff0d8>До «<rank>»:</color> <#f4bd6a>ещё <remaining> мин. активной игры.</color>'
    paths: |-
      <prefix> <#fff0d8>До «<rank>»:</color> <#f4bd6a>закройте ещё <remaining> путей развития.</color>
      <#8d7768>Ближайший — <path>.</color>
    unavailable: |-
      <prefix> <#e6a348>Доступно <available> путей из нужных <required>.</color>
      <#8d7768>Прогресс сохранится.</color>
      <#8d7768>Администраторы уже видят проблему.</color>
    top: |-
      <prefix> <#f4bd6a>У вас высший постоянный ранг.</color>
      <#fff0d8>Продолжайте прокачивать специализации.</color>
  benefits:
    header: '<prefix> <#fff0d8>Усиления ранга «<rank>»:</color>'
    entry: '<#8d7768>•</color> <#f4bd6a><benefit></color>'
  focus:
    selected: |-
      <prefix> <#63ad6b>Основной путь: <path>.</color>
      <#8d7768>Другие пути продолжают считаться.</color>
    unknown: |-
      <prefix> <#e6a348>Неизвестный путь.</color>
      <#8d7768>farming, industry, trade</color>
      <#8d7768>exploration, building, community</color>
  contracts:
    accepted: '<prefix> <#63ad6b>Контракт принят.</color> <#8d7768>Играйте как обычно.</color>'
    already-active: '<prefix> <#e6a348>Сначала завершите активный контракт.</color>'
    offer-unavailable: '<prefix> <#e6a348>Предложение уже изменилось.</color> <#8d7768>Обновите экран.</color>'
    cycle-complete: '<prefix> <#63ad6b>Все контракты этой недели завершены.</color>'
    claimed: '<prefix> <#63ad6b>Награда и штамп получены.</color>'
    not-ready: '<prefix> <#e6a348>Цель контракта ещё не выполнена.</color>'
    already-claimed: '<prefix> <#8d7768>Эта награда уже получена.</color>'
    no-active: '<prefix> <#e6a348>Активного контракта нет.</color>'
    rerolled: '<prefix> <#63ad6b>Предложения обновлены бесплатно.</color>'
    reroll-used: '<prefix> <#e6a348>Бесплатное обновление уже использовано.</color>'
    storage-unavailable: |-
      <prefix> <#c95d4b>Контракты временно недоступны.</color>
      <#8d7768>Ничего не потеряно.</color>
  perks:
    selected: '<prefix> <#63ad6b>Перк «<perk>» выбран.</color>'
    already-selected: '<prefix> <#8d7768>Перк «<perk>» уже работает.</color>'
    removed: '<prefix> <#f4bd6a>Перк «<perk>» снят.</color>'
    not-selected: '<prefix> <#8d7768>Перк «<perk>» уже снят.</color>'
    locked: |-
      <prefix> <#e6a348>Перк «<perk>» пока закрыт.</color>
      <#8d7768>Он откроется с развитием пути.</color>
    full: '<prefix> <#e6a348>Обе ячейки заняты.</color> <#8d7768>Снимите другой перк.</color>'
    storage-unavailable: '<prefix> <#c95d4b>Перки временно недоступны.</color>'
  weekly-kit:
    claimed: |-
      <prefix> <#63ad6b><bold>Недельный набор получен.</bold></color>
      <#8d7768>Следующий будет доступен в понедельник.</color>
    already-claimed: '<prefix> <#8d7768>Набор этой недели уже получен.</color>'
    delivery-pending: |-
      <prefix> <#e6a348>Набор уже обрабатывается.</color>
      <#8d7768>Если награда не появилась, сообщите администрации.</color>
    inventory-full: '<prefix> <#e6a348>Освободите минимум <required> яч. инвентаря.</color>'
    provider-rejected: '<prefix> <#c95d4b>CMI не выдал набор.</color> <#8d7768>Попробуйте ещё раз.</color>'
    storage-unavailable: '<prefix> <#c95d4b>Недельные наборы временно недоступны.</color>'
  promotion:
    success: |-
      <#d9864f><bold>✦ Новый ранг — <rank>! ✦</bold></color>
      <#fff0d8>Старые возможности остались.</color>
      <#fff0d8>Развитие стало глубже.</color>
    busy: '<prefix> <#e6a348>Повышение уже обрабатывается.</color>'
    retryable: |-
      <prefix> <#e6a348>Повышение сохранено, но не завершено.</color>
      <#8d7768>Повторите /rankup — операция продолжится безопасно.</color>
    not-eligible: '<prefix> <#e6a348>Условия ещё не выполнены.</color> <#8d7768>Введите /rank why.</color>'
  reload:
    success: '<prefix> <#63ad6b>Настройки, ранги и тексты обновлены.</color>'
    failure: |-
      <prefix> <#c95d4b>Не удалось обновить ArcRanks:</color>
      <#8d7768><reason></color>
  admin:
    inspect: '<prefix> <#fff0d8><player>:</color> <#f4bd6a><rank></color>, <#8d7768>следующий — <next>.</color>'
    grant-success: '<prefix> <#63ad6b><player>: +<amount> к <metric>.</color>'
    grant-duplicate: |-
      <prefix> <#e6a348>Событие <event-id> уже применялось.</color>
      <#8d7768>Повторная награда не выдана.</color>
    grant-invalid: |-
      <prefix> <#e6a348>Формат:</color>
      <#fff0d8>/rank admin grant [игрок] [метрика]</color>
      <#fff0d8>[количество] [event-id]</color>
    simulate: '<prefix> <#fff0d8>Симуляция <player>:</color> <#f4bd6a><result></color>'
    analytics: |-
      <prefix> <#f4bd6a>Аналитика за <days> дней</color>
      <#fff0d8>Игроков: <players> • открыли меню: <passport></color>
      <#fff0d8>Контракты: <accepted> → <completed> • перки: <perks></color>
      <#fff0d8>Повышений: <promotions> • потеряно событий: <dropped></color>
    analytics-invalid: '<prefix> <#e6a348>Период: 7, 14 или 30 дней.</color>'
