    claim-tooltip: '<#e8dfd2>Grant the listed items and mark the kit claimed until next Monday.</color>'
    loading: '<#e8dfd2>Checking your current rank and this week’s kit state…</color>'
    claiming: '<#e8dfd2>Checking inventory space and granting the weekly kit…</color>'
    saving: '<#e8dfd2>Checking delivery state and applying the administrative reset…</color>'
  admin:
    advance: '<#ffad52><bold>ADMIN: complete nearest requirement</bold></color>'
    advance-tooltip: '<#e8dfd2>Add exactly the missing progress for the nearest requirement. This does not grant the rank automatically.</color>'
    contract-complete: '<#ffad52><bold>ADMIN: complete contract</bold></color>'
    contract-complete-tooltip: '<#e8dfd2>Mark the active contract complete. Its reward must still be claimed normally.</color>'
    kit-reset: '<#ffad52><bold>ADMIN: reset claim</bold></color>'
