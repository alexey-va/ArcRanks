    contract-completed: |-
      <prefix> <#ff9f0f><player>: contract completed by an administrator.</color>
      <#8c8c8c>The reward was not granted; use the regular chest.</color>
    contract-already-ready: '<prefix> <#8c8c8c><player>: contract is already ready to claim.</color>'
    contract-no-active: '<prefix> <#ff9f0f><player>: no active contract.</color>'
    contract-invalid: |-
      <prefix> <#ff9f0f>Usage:</color>
      <#fff0d8>/rank admin contract complete [player]</color>
    advance-applied: |-
      <prefix> <#ff9f0f><player>: added <amount> to the nearest requirement.</color>
      <#8c8c8c>Progress is permanent. Use the normal promotion button.</color>
    advance-duplicate: '<prefix> <#ff9f0f><player>: this step was already applied.</color>'
    advance-ready: '<prefix> <#8c8c8c><player>: the next rank requirements are complete.</color>'
    advance-top: '<prefix> <#8c8c8c><player>: the highest permanent rank is already complete.</color>'
    advance-invalid: |-
      <prefix> <#ff9f0f>Usage:</color>
      <#fff0d8>/rank admin advance [player]</color>
    kit-invalid: |-
      <prefix> <#ff9f0f>Usage:</color>
      <#fff0d8>/rank admin kit reset [player]</color>
