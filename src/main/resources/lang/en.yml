      lore:
        - '<italic:false><#fff0d8>An upgrade is a passive bonus that stays active.</color>'
        - '<italic:false><#8c8c8c>Perks can improve harvests, tool durability, XP, movement, protection or path progress.</color>'
        - '<italic:false><#8c8c8c>Matching effects use the strongest selected value; they do not stack.</color>'
        - '<italic:false><#8c8c8c>New upgrades unlock at path tiers I, II, and III.</color>'
        - '<italic:false><#8c8c8c>No more than two upgrades can be active at once.</color>'
        - '<italic:false><#8c8c8c>You may switch or disable them for free at any time.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#8c8c8c>[</color><#2bba43>▶</color><#8c8c8c>]</color> <#2bba43>Left click</color><#fff0d8> — choose upgrades</color>'
