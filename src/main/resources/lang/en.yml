prefix: '<#f4bd6a>Ranks</color> <#8c8c8c>•</color>'
features:
  contracts: 'Contracts'
  perks: 'Path upgrades'
  weekly-kits: 'Weekly kits'
commands:
  help: |-
    <prefix> <#fff0d8>/rank</color> <#8c8c8c>— ranks and progression</color>
    <#f4bd6a>/rank dialog</color> <#8c8c8c>— open the detailed native dialog version</color>
    <#f4bd6a>/rank why</color> <#8c8c8c>— what remains for the next rank</color>
    <#f4bd6a>/rank benefits</color> <#8c8c8c>— current and future upgrades</color>
    <#f4bd6a>/rank kit</color> <#8c8c8c>— current rank's weekly kit</color>
    <#f4bd6a>/rank focus [path]</color> <#8c8c8c>— guidance and contracts for one path</color>
    <#f4bd6a>/rank contracts</color> <#8c8c8c>— personal weekly goals</color>
    <#f4bd6a>/rank perks</color> <#8c8c8c>— choose two passive upgrades</color>
    <#f4bd6a>/rankup</color> <#8c8c8c>— promote your rank</color>
  player-only: '<prefix> <#c42323>This command is only available in game.</color>'
  no-permission: '<prefix> <#c42323>You do not have permission to use this command.</color>'
  feature-disabled: |-
    <prefix> <#f4bd6a>The “<feature>” feature is currently disabled.</color>
    <#8c8c8c>An administrator can enable it.</color>
  loading: '<prefix> <#fff0d8>Loading your progress…</color>'
  storage-unavailable: |-
    <prefix> <#c42323>Progress is temporarily unavailable.</color>
    <#8c8c8c>Nothing was lost; try again shortly.</color>
  shadow-mode: |-
    <prefix> <#ff9f0f>Promotion is currently in verification mode.</color>
    <#8c8c8c>Your progress is already tracked.</color>
  rank-state:
    missing: |-
      <prefix> <#ff9f0f>Could not determine your main rank.</color>
      <#8c8c8c>Please contact an administrator.</color>
    conflict: |-
      <prefix> <#c42323>Could not determine your main rank.</color>
      <#8c8c8c>Please contact an administrator.</color>
    unknown: '<prefix> <#c42323>Could not refresh your rank.</color> <#8c8c8c>Try again later.</color>'
  why:
    ready: '<prefix> <#2bba43>Everything is ready.</color> <#fff0d8>You can promote to “<rank>”.</color>'
    core: '<prefix> <#fff0d8>Until “<rank>”:</color> <#f4bd6a><remaining> of active play remaining.</color>'
    paths: |-
      <prefix> <#fff0d8>Until “<rank>”:</color> <#f4bd6a>complete <remaining> more paths.</color>
      <#8c8c8c>Closest: <path>.</color>
    unavailable: |-
      <prefix> <#ff9f0f><available> of <required> required paths are available.</color>
      <#8c8c8c>Progress is saved.</color>
      <#8c8c8c>Administrators can see the issue.</color>
    top: |-
      <prefix> <#f4bd6a>You hold the highest permanent rank.</color>
      <#fff0d8>Keep developing paths and unlocking their upgrades.</color>
  benefits:
    header: '<prefix> <#fff0d8>Enhancements for “<rank>”:</color>'
  focus:
    selected: |-
      <prefix> <#2bba43>Focus: <path>.</color>
      <#8c8c8c>It only changes guidance and contract offers.</color>
      <#8c8c8c>Other paths continue growing at their normal speed.</color>
    unknown: |-
      <prefix> <#ff9f0f>Unknown path.</color>
      <#8c8c8c>farming, industry, trade</color>
      <#8c8c8c>exploration, building, community</color>
  contracts:
    accepted: |-
      <prefix> <#2bba43>Contract accepted: <path>.</color>
      <#f4bd6a>Goal:</color> <#fff0d8>earn <target> points.</color>
      <#8c8c8c>What counts:</color>
      <#fff0d8>  <action-first></color>
      <#fff0d8>  <action-second></color>
      <#fff0d8>  <action-third></color>
      <#f4bd6a>Reward:</color> <#2bba43>+<reward> path progress, <money> coins, <tokens> tokens.</color>
      <#f4bd6a>Item:</color> <#2bba43><item-amount> × <item>.</color>
      <#8c8c8c>When complete, open </color><#f4bd6a>/rank → “Contracts”</color><#8c8c8c>.</color>
      <#8c8c8c>Collect the ready reward.</color>
    already-active: '<prefix> <#ff9f0f>Complete your active contract first.</color>'
    offer-unavailable: '<prefix> <#ff9f0f>This offer has changed.</color> <#8c8c8c>Refresh the screen.</color>'
    cycle-complete: '<prefix> <#2bba43>Every contract for this week is complete.</color>'
    claimed: |-
      <prefix> <#2bba43>Contract complete. Reward received:</color>
      <#fff0d8>+<reward> path progress, <money> coins, <tokens> tokens, and <item-amount> × <item>.</color>
    delivery-pending: |-
      <prefix> <#ff9f0f>Contract complete and reward saved.</color>
      <#8c8c8c>Delivery will retry automatically.</color>
    delivery-recovery: |-
      <prefix> <#c42323>Contract complete, but delivery needs review.</color>
      <#8c8c8c>Contact an administrator.</color>
    not-ready: '<prefix> <#ff9f0f>The contract goal is not complete yet.</color>'
    already-claimed: '<prefix> <#8c8c8c>This reward was already collected.</color>'
    no-active: '<prefix> <#ff9f0f>You have no active contract.</color>'
    rerolled: '<prefix> <#2bba43>Offers refreshed for free.</color>'
    reroll-used: '<prefix> <#ff9f0f>The free refresh was already used.</color>'
    storage-unavailable: |-
      <prefix> <#c42323>Contracts are temporarily unavailable.</color>
      <#8c8c8c>Nothing was lost.</color>
  perks:
    selected: '<prefix> <#2bba43>Upgrade “<perk>” enabled.</color>'
    already-selected: '<prefix> <#8c8c8c>Upgrade “<perk>” is already active.</color>'
    removed: '<prefix> <#f4bd6a>Upgrade “<perk>” disabled.</color>'
    not-selected: '<prefix> <#8c8c8c>Upgrade “<perk>” is already disabled.</color>'
    locked: |-
      <prefix> <#ff9f0f>Upgrade “<perk>” is still locked.</color>
      <#8c8c8c>It unlocks when you raise this path’s tier.</color>
    full: |-
      <prefix> <#ff9f0f>Both upgrade slots are occupied.</color>
      <#8c8c8c>Disable one of them first.</color>
    storage-unavailable: '<prefix> <#c42323>Upgrades are temporarily unavailable.</color>'
  weekly-kit:
    claimed: |-
      <prefix> <#2bba43><bold>Weekly kit claimed.</bold></color>
      <#8c8c8c>The next one becomes available on Monday.</color>
    already-claimed: '<prefix> <#8c8c8c>This week''s kit has already been claimed.</color>'
    delivery-pending: |-
      <prefix> <#ff9f0f>The kit is already being processed.</color>
      <#8c8c8c>If the reward did not arrive, contact an administrator.</color>
    inventory-full: '<prefix> <#ff9f0f>Free at least <required> inventory slots.</color>'
    provider-rejected: '<prefix> <#c42323>CMI did not deliver the kit.</color> <#8c8c8c>Try again.</color>'
    storage-unavailable: '<prefix> <#c42323>Weekly kits are temporarily unavailable.</color>'
    admin-reset: |-
      <prefix> <#ff9f0f><player>: weekly kit claim reset.</color>
      <#8c8c8c>Previously delivered items were not removed.</color>
    admin-reset-delivering: |-
      <prefix> <#c42323><player>: delivery is active; reset blocked.</color>
      <#8c8c8c>Check the delivery outcome first.</color>
    admin-reset-not-claimed: '<prefix> <#8c8c8c><player>: this week’s kit has not been claimed yet.</color>'
    admin-reset-storage-unavailable: '<prefix> <#c42323>Could not reset the weekly kit claim.</color>'
  promotion:
    success: |-
      <#f4bd6a><bold>✦ New rank — <rank>! ✦</bold></color>
      <#fff0d8>Your existing options remain.</color>
      <#fff0d8>Progression gains more depth.</color>
    busy: '<prefix> <#ff9f0f>Your promotion is already being processed.</color>'
    retryable: |-
      <prefix> <#ff9f0f>Your promotion was saved but not completed.</color>
      <#8c8c8c>Run /rankup again to resume safely.</color>
    not-eligible: '<prefix> <#ff9f0f>The requirements are not complete yet.</color> <#8c8c8c>Run /rank why.</color>'
  reload:
    success: '<prefix> <#2bba43>Settings, ranks, and messages were reloaded.</color>'
    no-changes: '<prefix> <#8c8c8c>No configuration changes were found.</color>'
    restart-required: |-
      <prefix> <#ff9f0f>These settings require a restart:</color>
      <#8c8c8c><paths></color>
    busy: '<prefix> <#ff9f0f>A configuration reload is already running.</color>'
    failure: |-
      <prefix> <#c42323>Could not reload ArcRanks:</color>
      <#8c8c8c><reason></color>
  admin:
    inspect: '<prefix> <#fff0d8><player>:</color> <#f4bd6a><rank></color>, <#8c8c8c>next — <next>.</color>'
    grant-success: '<prefix> <#2bba43><player>: +<amount> to <metric>.</color>'
    grant-duplicate: |-
      <prefix> <#ff9f0f>Event <event-id> was already applied.</color>
      <#8c8c8c>No duplicate progress was granted.</color>
    grant-invalid: |-
      <prefix> <#ff9f0f>Usage:</color>
      <#fff0d8>/rank admin grant [player] [metric]</color>
      <#fff0d8>[amount] [event-id]</color>
    simulate: '<prefix> <#fff0d8>Simulation for <player>:</color> <#f4bd6a><result></color>'
    analytics: |-
      <prefix> <#f4bd6a>Analytics for <days> days</color>
      <#fff0d8>Players: <players> • opened menu: <passport></color>
      <#fff0d8>Contracts: <accepted> → <completed> • perks: <perks></color>
      <#fff0d8>Promotions: <promotions> • dropped events: <dropped></color>
    analytics-invalid: '<prefix> <#ff9f0f>Window must be 7, 14, or 30 days.</color>'
    contract-completed: |-
      <prefix> <#ff9f0f><player>: contract completed by an administrator.</color>
      <#8c8c8c>The reward was not granted; use the regular chest.</color>
    contract-already-ready: '<prefix> <#8c8c8c><player>: contract is already ready to claim.</color>'
    contract-no-active: '<prefix> <#ff9f0f><player>: no active contract.</color>'
    contract-invalid: |-
      <prefix> <#ff9f0f>Usage:</color>
      <#fff0d8>/rank admin contract complete [player]</color>
    advance-applied: |-
      <prefix> <#ff9f0f><player>: added <amount> to the nearest requirement.</color>
      <#8c8c8c>Progress is permanent. Use the normal promotion button.</color>
    advance-duplicate: '<prefix> <#ff9f0f><player>: this step was already applied.</color>'
    advance-ready: '<prefix> <#8c8c8c><player>: the next rank requirements are complete.</color>'
    advance-top: '<prefix> <#8c8c8c><player>: the highest permanent rank is already complete.</color>'
    advance-invalid: |-
      <prefix> <#ff9f0f>Usage:</color>
      <#fff0d8>/rank admin advance [player]</color>
    kit-invalid: |-
      <prefix> <#ff9f0f>Usage:</color>
      <#fff0d8>/rank admin kit reset [player]</color>
mastery:
  none: 'No tier'
  i: 'I'
  ii: 'II'
  iii: 'III'
duration:
  minutes: '<minutes>m'
  hours: '<hours>h'
  hours-minutes: '<hours>h <minutes>m'
  days: '<days>d'
  days-hours: '<days>d <hours>h'
  days-minutes: '<days>d <minutes>m'
  days-hours-minutes: '<days>d <hours>h <minutes>m'
dialogs:
  common:
    none: 'none'
    back: '<#9db0ba>‹ Back</color>'
    refresh: '<#4dd8f0>Refresh data</color>'
    retry: '<#ffca55>Try again</color>'
    help: '<#9db0ba>‹ Back</color>'
    help-tooltip: '<#9db0ba>Return to the main /help dialog.</color>'
    open-tooltip: '<#9db0ba>Open this dialog section.</color>'
    loading-title: '<#ffca55><bold>Ranks and progression</bold></color>'
    loading: '<#f5fbff>Loading your current rank, progress and available actions…</color>'
    error-title: '<#ffad52><bold>Data is temporarily unavailable</bold></color>'
    error: |-
      <#f5fbff>Current rank data could not be loaded.</color>
      <#9db0ba>Your progress is safe. Try again in a few seconds.</color>
  root:
    title: '<#ffca55><bold>Ranks and progression</bold></color>'
    intro: |-
      <#f5fbff>Your rank represents permanent server progression.</color>
      <#9db0ba>To rank up, gain active play time and complete the required number of goals in any progression paths. Completed requirements never expire.</color>
    status: |-
      <#ffca55><bold>Current status</bold></color>
      <#f5fbff>Rank:</color> <#7fe38b><rank></color>
      <#f5fbff>Focus:</color> <#4dd8f0><focus></color>
      <#9db0ba>Focus only changes hints and contract offers. All six paths keep gaining progress.</color>
    next: |-
      <#ffca55><bold>Next goal — <next></bold></color>
      <#f5fbff><recommendation></color>
      <#9db0ba>Open “Progression paths” to see exact numbers and actions for each path.</color>
    top: |-
      <#7fe38b><bold>You already hold the highest permanent rank.</bold></color>
      <#9db0ba>Paths, contracts, perks and weekly rewards remain available.</color>
    paths: '<#4dd8f0>Progression paths ›</color>'
    benefits: '<#ffca55>Ranks and benefits ›</color>'
    contracts: '<#7fe38b>Personal contracts ›</color>'
    perks: '<#4f8cff>Path perks ›</color>'
    weekly-kit: '<#ffad52>Weekly kit ›</color>'
    promote: '<#7fe38b><bold>Rank up</bold></color>'
    promote-tooltip: '<#f5fbff>All requirements are complete. Click to receive the next permanent rank.</color>'
    promoting: '<#f5fbff>Checking requirements and granting the next permanent rank…</color>'
  benefits:
    title: '<#ffca55><bold>Ranks and benefits</bold></color>'
    intro: |-
      <#f5fbff>Every new rank permanently adds server benefits.</color>
      <#9db0ba>Open any rank to see its exact limits, features, commands and rewards.</color>
    completed: '<#7fe38b>Received:</color>'
    current: '<#ffca55>Your rank:</color>'
    next: '<#4dd8f0>Next:</color>'
    locked: '<#9db0ba>Later:</color>'
    open-tooltip: '<#9db0ba>Show the complete list of benefits for this rank.</color>'
    state-completed: '<#7fe38b>already received</color>'
    state-current: '<#ffca55>your current rank</color>'
    state-next: '<#4dd8f0>the next available rank</color>'
    state-locked: '<#9db0ba>unlocks later</color>'
    detail: |-
      <#ffca55><bold><rank></bold></color> <#9db0ba>— <state></color>
      <#f5fbff>What this rank grants:</color>
    all: '<#9db0ba>‹ Back</color>'
  paths:
    title: '<#4dd8f0><bold>Progression paths</bold></color>'
    intro: |-
      <#f5fbff>A path is one direction of gameplay progress: farming, production, trade, exploration, building or community.</color>
      <#9db0ba>You do not need all six for the next rank. Complete the displayed number of any available paths.</color>
    status: |-
      <#ffca55><bold>Next-rank progress</bold></color>
      <#f5fbff>Completed paths:</color> <#7fe38b><completed></color><#9db0ba>/</color><#f5fbff><required></color>
      <#f5fbff>Current focus:</color> <#4dd8f0><focus></color>
    marker-focus: '<#ffca55>★ Focus</color> —'
    marker-complete: '<#7fe38b>◆ Complete</color> —'
    marker-unavailable: '<#ffad52>Unavailable</color> —'
    marker-progress: '<#9db0ba>In progress</color> —'
    detail: |-
      <#ffca55><bold>About this path</bold></color>
      <#ffca55><bold><path></bold></color> <#9db0ba>— <summary></color>
      <#f5fbff><details></color>
    actions: '<#ffca55><bold>What to do</bold></color>'
    progress: |-
      <#ffca55><bold>Your progress</bold></color>
      <#7fe38b><bar></color>
      <#f5fbff>Current:</color> <#4dd8f0><current></color> <#9db0ba>/</color> <#f5fbff><target></color> <#9db0ba>target (<percent>%)</color>
      <#f5fbff>Path tier:</color> <#4dd8f0><mastery></color> <#9db0ba>·</color> <#f5fbff>Status:</color> <state>
    focus-explanation: |-
      <#ffca55><bold>What focus means</bold></color>
      <#9db0ba>Focus does not speed up or stop progress. It chooses which path hints recommend first and makes contracts for that path more likely.</color>
    select-focus: '<#ffca55>Set as focus</color>'
    select-focus-tooltip: '<#9db0ba>Hints and contract offers will prefer this path. Other paths keep progressing.</color>'
    all: '<#9db0ba>‹ Back</color>'
    saving: '<#f5fbff>Saving the new focus and reloading your progress…</color>'
    state-unavailable: '<#ffad52>its progress source is currently unavailable</color>'
    state-focus: '<#ffca55>selected as focus</color>'
    state-complete: '<#7fe38b>next-rank requirement completed</color>'
    state-progress: '<#9db0ba>requirement still in progress</color>'
  contracts:
    title: '<#7fe38b><bold>Personal contracts</bold></color>'
    intro: |-
      <#f5fbff>A contract is a specific weekly task with a separate reward.</color>
      <#9db0ba>Choose one offer, perform the listed actions, return here and claim the reward. Only one contract can be active at a time.</color>
    status: |-
      <#ffca55><bold>Weekly cycle: <period></bold></color>
      <#f5fbff>Claimed stamps:</color> <#7fe38b><stamps></color><#9db0ba>/3</color>
      <#9db0ba>Each claimed reward grants one stamp. Three stamps mean the week is complete. Remaining: <remaining>.</color>
    offer: |-
      <#ffca55><bold>Offer <number>: <path></bold></color>
      <#f5fbff>Your task:</color> gain <#4dd8f0><target> path points</color> after accepting this contract.
      <#f5fbff>Reward:</color> <#7fe38b>+<reward> path progress, <money> coins, <tokens> tokens and <item-amount> × <item></color>
    active: |-
      <#ffca55><bold>Active contract: <path></bold></color>
      <#f5fbff>Required:</color> <#4dd8f0><target></color> <#9db0ba>·</color> <#f5fbff>done:</color> <#7fe38b><current></color> <#9db0ba>·</color> <#f5fbff>left:</color> <#ffca55><remaining></color>
      <#7fe38b><bar></color>
      <#f5fbff>Once complete, click “Claim reward”.</color>
      <#f5fbff>Reward:</color> <#7fe38b>+<reward> path progress, <money> coins, <tokens> tokens and <item-amount> × <item></color>
    active-ready: |-
      <#7fe38b><bold>Contract complete: <path></bold></color>
      <#f5fbff>The <target> point target is complete. The reward has not been granted yet.</color>
      <#7fe38b><bar></color>
      <#f5fbff>Click “Claim reward” to receive +<reward> path progress, <money> coins, <tokens> tokens and <item-amount> × <item>.</color>
    counts: '<#ffca55><bold>Actions that count</bold></color>'
    accept: '<#7fe38b>Accept offer <number></color>'
    accept-tooltip: '<#9db0ba>Only progress made after acceptance counts toward this task.</color>'
    claim: '<#7fe38b><bold>Claim reward</bold></color>'
    claim-tooltip: '<#f5fbff>Grant path progress, coins, tokens and the item, then add one weekly stamp.</color>'
    reroll: '<#4dd8f0>Replace offers for free</color>'
    reroll-tooltip: '<#9db0ba>Available once per week before a contract is accepted.</color>'
    complete: |-
      <#7fe38b><bold>All three contracts for this week are complete.</bold></color>
      <#9db0ba>New offers will appear in the next weekly cycle.</color>
    loading: '<#f5fbff>Loading weekly offers, the active contract and claimed stamps…</color>'
    saving: '<#f5fbff>Checking the current contract state and applying the action…</color>'
  perks:
    title: '<#4f8cff><bold>Path perks</bold></color>'
    intro: |-
      <#f5fbff>Perks are two permanent passive effects that you choose.</color>
      <#9db0ba>They unlock through path tiers. Choose a slot, then a path and an effect. Selecting into an occupied slot replaces its old effect.</color>
    slot-empty: '<#f5fbff>Slot <slot>:</color> <#9db0ba>empty — no effect selected.</color>'
    slot-active: '<#f5fbff>Slot <slot>:</color> <#7fe38b><perk></color> <#9db0ba>— <description></color>'
    choose-slot: '<#4f8cff>Configure slot <slot> ›</color>'
    slot-title: '<#4f8cff><bold>Perk slot <slot></bold></color>'
    slot-intro: '<#f5fbff>Choose a path. You will then see all three effects, their unlock requirements and can assign one to slot <slot>.</color>'
    path-intro: |-
      <#ffca55><bold><path></bold></color>
      <#f5fbff>Your tier:</color> <#4dd8f0><mastery></color> <#9db0ba>·</color> <#f5fbff>editing slot:</color> <#4f8cff><slot></color>
    card: |-
      <#ffca55><bold><number>. <perk></bold></color> <#9db0ba>— <state></color>
      <#f5fbff><description></color>
      <#9db0ba>Required path tier: <required>.</color>
    state-active: '<#7fe38b>currently active</color>'
    state-locked: '<#ffad52>locked</color>'
    state-available: '<#4dd8f0>available</color>'
    select: '<#4f8cff>Select “<perk>”</color>'
    disable: '<#ffad52>Disable “<perk>”</color>'
    saving: '<#f5fbff>Checking the path tier and saving your selected perk…</color>'
  weekly-kit:
    title: '<#ffad52><bold>Weekly kit</bold></color>'
    intro: |-
      <#f5fbff>Once per week, your current rank grants a separate item kit.</color>
      <#9db0ba>The kit improves with your rank. Eligibility resets every Monday.</color>
    status: |-
      <#f5fbff>Kit rank:</color> <#ffca55><rank></color>
      <#f5fbff>Status:</color> <state>
      <#9db0ba>Free at least <required> main-inventory slots before claiming.</color>
    state:
      available: '<#7fe38b>available now</color>'
      delivering: '<#ffca55>delivery is already in progress</color>'
      claimed: '<#9db0ba>already claimed this week</color>'
    claim: '<#7fe38b><bold>Claim kit</bold></color>'
    claim-tooltip: '<#f5fbff>Grant the listed items and mark the kit claimed until next Monday.</color>'
    loading: '<#f5fbff>Checking your current rank and this week’s kit state…</color>'
    claiming: '<#f5fbff>Checking inventory space and granting the weekly kit…</color>'
    saving: '<#f5fbff>Checking delivery state and applying the administrative reset…</color>'
  admin:
    advance: '<#ffad52><bold>ADMIN: complete nearest requirement</bold></color>'
    advance-tooltip: '<#f5fbff>Add exactly the missing progress for the nearest requirement. This does not grant the rank automatically.</color>'
    contract-complete: '<#ffad52><bold>ADMIN: complete contract</bold></color>'
    contract-complete-tooltip: '<#f5fbff>Mark the active contract complete. Its reward must still be claimed normally.</color>'
    kit-reset: '<#ffad52><bold>ADMIN: reset claim</bold></color>'
    kit-reset-tooltip: '<#f5fbff>Allow this week’s kit to be claimed again. Already granted items are not removed.</color>'
    analytics: '<#ffad52><bold>ADMIN: rank analytics</bold></color>'
    analytics-tooltip: '<#f5fbff>Show use of menus, contracts, perks and promotions.</color>'
    working: '<#f5fbff>Reloading progress and completing the nearest requirement…</color>'
    analytics-loading: '<#f5fbff>Loading aggregate rank statistics…</color>'
    analytics-title: '<#ffad52><bold>ADMIN: rank analytics</bold></color>'
    analytics-body: |-
      <#ffca55><bold>Period: <days> days</bold></color>
      <#f5fbff>Unique players:</color> <players>
      <#f5fbff>Opened menu:</color> <passport>
      <#f5fbff>Accepted contracts:</color> <accepted> <#9db0ba>·</color> <#f5fbff>completed:</color> <completed>
      <#f5fbff>Selected a perk:</color> <perks> <#9db0ba>·</color> <#f5fbff>ranked up:</color> <promotions>
      <#f5fbff>Dropped telemetry events:</color> <dropped>
    analytics-window: '<#9db0ba><days> days</color>'
