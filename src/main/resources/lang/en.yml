prefix: '<#f4bd6a>Ranks</color> <#8c8c8c>•</color>'
features:
  contracts: 'Contracts'
  perks: 'Perks'
  weekly-kits: 'Weekly kits'
commands:
  help: |-
    <prefix> <#fff0d8>/rank</color> <#8c8c8c>— ranks and progression</color>
    <#f4bd6a>/rank why</color> <#8c8c8c>— what remains for the next rank</color>
    <#f4bd6a>/rank benefits</color> <#8c8c8c>— current and future upgrades</color>
    <#f4bd6a>/rank kit</color> <#8c8c8c>— current rank's weekly kit</color>
    <#f4bd6a>/rank focus [path]</color> <#8c8c8c>— choose a specialization</color>
    <#f4bd6a>/rank contracts</color> <#8c8c8c>— personal weekly goals</color>
    <#f4bd6a>/rank perks</color> <#8c8c8c>— specialization enhancements</color>
    <#f4bd6a>/rankup</color> <#8c8c8c>— promote your rank</color>
  player-only: '<prefix> <#c42323>This command is only available in game.</color>'
  no-permission: '<prefix> <#c42323>You do not have permission to use this command.</color>'
  feature-disabled: |-
    <prefix> <#f4bd6a>The “<feature>” feature is currently disabled.</color>
    <#8c8c8c>An administrator can enable it.</color>
  loading: '<prefix> <#fff0d8>Loading your progress…</color>'
  storage-unavailable: |-
    <prefix> <#c42323>Progress is temporarily unavailable.</color>
    <#8c8c8c>Nothing was lost; try again shortly.</color>
  shadow-mode: |-
    <prefix> <#ff9f0f>Promotion is currently in verification mode.</color>
    <#8c8c8c>Your progress is already tracked.</color>
  rank-state:
    missing: |-
      <prefix> <#ff9f0f>Could not determine your main rank.</color>
      <#8c8c8c>Please contact an administrator.</color>
    conflict: |-
      <prefix> <#c42323>Could not determine your main rank.</color>
      <#8c8c8c>Please contact an administrator.</color>
    unknown: '<prefix> <#c42323>Could not refresh your rank.</color> <#8c8c8c>Try again later.</color>'
  why:
    ready: '<prefix> <#2bba43>Everything is ready.</color> <#fff0d8>You can promote to “<rank>”.</color>'
    core: '<prefix> <#fff0d8>Until “<rank>”:</color> <#f4bd6a><remaining> of active play remaining.</color>'
    paths: |-
      <prefix> <#fff0d8>Until “<rank>”:</color> <#f4bd6a>complete <remaining> more paths.</color>
      <#8c8c8c>Closest: <path>.</color>
    unavailable: |-
      <prefix> <#ff9f0f><available> of <required> required paths are available.</color>
      <#8c8c8c>Progress is saved.</color>
      <#8c8c8c>Administrators can see the issue.</color>
    top: |-
      <prefix> <#f4bd6a>You hold the highest permanent rank.</color>
      <#fff0d8>Keep developing your specializations.</color>
  benefits:
    header: '<prefix> <#fff0d8>Enhancements for “<rank>”:</color>'
  focus:
    selected: |-
      <prefix> <#2bba43>Focus: <path>.</color>
      <#8c8c8c>Other paths keep progressing.</color>
    unknown: |-
      <prefix> <#ff9f0f>Unknown path.</color>
      <#8c8c8c>farming, industry, trade</color>
      <#8c8c8c>exploration, building, community</color>
  contracts:
    accepted: '<prefix> <#2bba43>Contract accepted.</color> <#8c8c8c>Keep playing as usual.</color>'
    already-active: '<prefix> <#ff9f0f>Complete your active contract first.</color>'
    offer-unavailable: '<prefix> <#ff9f0f>This offer has changed.</color> <#8c8c8c>Refresh the screen.</color>'
    cycle-complete: '<prefix> <#2bba43>Every contract for this week is complete.</color>'
    claimed: '<prefix> <#2bba43>Reward and stamp collected.</color>'
    not-ready: '<prefix> <#ff9f0f>The contract goal is not complete yet.</color>'
    already-claimed: '<prefix> <#8c8c8c>This reward was already collected.</color>'
    no-active: '<prefix> <#ff9f0f>You have no active contract.</color>'
    rerolled: '<prefix> <#2bba43>Offers refreshed for free.</color>'
    reroll-used: '<prefix> <#ff9f0f>The free refresh was already used.</color>'
    storage-unavailable: |-
      <prefix> <#c42323>Contracts are temporarily unavailable.</color>
      <#8c8c8c>Nothing was lost.</color>
  perks:
    selected: '<prefix> <#2bba43>Perk “<perk>” equipped.</color>'
    already-selected: '<prefix> <#8c8c8c>Perk “<perk>” is already active.</color>'
    removed: '<prefix> <#f4bd6a>Perk “<perk>” removed.</color>'
    not-selected: '<prefix> <#8c8c8c>Perk “<perk>” is already removed.</color>'
    locked: |-
      <prefix> <#ff9f0f>Perk “<perk>” is still locked.</color>
      <#8c8c8c>It unlocks as this path grows.</color>
    full: '<prefix> <#ff9f0f>Both slots are occupied.</color> <#8c8c8c>Remove another perk.</color>'
    storage-unavailable: '<prefix> <#c42323>Perks are temporarily unavailable.</color>'
  weekly-kit:
    claimed: |-
      <prefix> <#2bba43><bold>Weekly kit claimed.</bold></color>
      <#8c8c8c>The next one becomes available on Monday.</color>
    already-claimed: '<prefix> <#8c8c8c>This week''s kit has already been claimed.</color>'
    delivery-pending: |-
      <prefix> <#ff9f0f>The kit is already being processed.</color>
      <#8c8c8c>If the reward did not arrive, contact an administrator.</color>
    inventory-full: '<prefix> <#ff9f0f>Free at least <required> inventory slots.</color>'
    provider-rejected: '<prefix> <#c42323>CMI did not deliver the kit.</color> <#8c8c8c>Try again.</color>'
    storage-unavailable: '<prefix> <#c42323>Weekly kits are temporarily unavailable.</color>'
  promotion:
    success: |-
      <#f4bd6a><bold>✦ New rank — <rank>! ✦</bold></color>
      <#fff0d8>Your existing options remain.</color>
      <#fff0d8>Progression gains more depth.</color>
    busy: '<prefix> <#ff9f0f>Your promotion is already being processed.</color>'
    retryable: |-
      <prefix> <#ff9f0f>Your promotion was saved but not completed.</color>
      <#8c8c8c>Run /rankup again to resume safely.</color>
    not-eligible: '<prefix> <#ff9f0f>The requirements are not complete yet.</color> <#8c8c8c>Run /rank why.</color>'
  reload:
    success: '<prefix> <#2bba43>Settings, ranks, and messages were reloaded.</color>'
    no-changes: '<prefix> <#8c8c8c>No configuration changes were found.</color>'
    restart-required: |-
      <prefix> <#ff9f0f>These settings require a restart:</color>
      <#8c8c8c><paths></color>
    busy: '<prefix> <#ff9f0f>A configuration reload is already running.</color>'
    failure: |-
      <prefix> <#c42323>Could not reload ArcRanks:</color>
      <#8c8c8c><reason></color>
  admin:
    inspect: '<prefix> <#fff0d8><player>:</color> <#f4bd6a><rank></color>, <#8c8c8c>next — <next>.</color>'
    grant-success: '<prefix> <#2bba43><player>: +<amount> to <metric>.</color>'
    grant-duplicate: |-
      <prefix> <#ff9f0f>Event <event-id> was already applied.</color>
      <#8c8c8c>No duplicate progress was granted.</color>
    grant-invalid: |-
      <prefix> <#ff9f0f>Usage:</color>
      <#fff0d8>/rank admin grant [player] [metric]</color>
      <#fff0d8>[amount] [event-id]</color>
    simulate: '<prefix> <#fff0d8>Simulation for <player>:</color> <#f4bd6a><result></color>'
    analytics: |-
      <prefix> <#f4bd6a>Analytics for <days> days</color>
      <#fff0d8>Players: <players> • opened menu: <passport></color>
      <#fff0d8>Contracts: <accepted> → <completed> • perks: <perks></color>
      <#fff0d8>Promotions: <promotions> • dropped events: <dropped></color>
    analytics-invalid: '<prefix> <#ff9f0f>Window must be 7, 14, or 30 days.</color>'
    contract-completed: |-
      <prefix> <#ff9f0f><player>: contract completed by an administrator.</color>
      <#8c8c8c>The reward was not granted; use the regular chest.</color>
    contract-already-ready: '<prefix> <#8c8c8c><player>: contract is already ready to claim.</color>'
    contract-no-active: '<prefix> <#ff9f0f><player>: no active contract.</color>'
    contract-invalid: |-
      <prefix> <#ff9f0f>Usage:</color>
      <#fff0d8>/rank admin contract complete [player]</color>
