    slot-title: '<#c4abff><bold>Perk slot <slot></bold></color>'
    slot-intro: '<#e8dfd2>Choose a path. You will then see all three effects, their unlock requirements and can assign one to slot <slot>.</color>'
    path-intro: |-
      <#f4bd6a><bold><path></bold></color>
      <#e8dfd2>Your tier:</color> <#d7b486><mastery></color> <#aaa49a>·</color> <#e8dfd2>editing slot:</color> <#c4abff><slot></color>
    card: |-
      <#f4bd6a><bold><number>. <perk></bold></color> <#aaa49a>— <state></color>
      <#e8dfd2><description></color>
      <#aaa49a>Required path tier: <required>.</color>
    state-active: '<#9bd48d>currently active</color>'
    state-locked: '<#aaa49a>locked</color>'
    state-available: '<#d7b486>available</color>'
    path: '<#c4a7e7><path> ›</color>'
    select: '<#ffffff>○ <perk></color>'
    disable: '<#9bd48d>✔ <perk></color>'
    unavailable: '<#aaa49a>[Unavailable] <perk></color>'
    unavailable-tooltip: '<#aaa49a>Requires path tier: <required>. Current tier: <current>.</color>'
    saving: '<#e8dfd2>Checking the path tier and saving your selected perk…</color>'
  weekly-kit:
    title: '<#c4abff><bold>Weekly kit</bold></color>'
    intro: |-
      <#e8dfd2>Once per week, your current rank grants a separate item kit.</color>
      <#aaa49a>The kit improves with your rank. Eligibility resets every Monday.</color>
    status: |-
      <#e8dfd2>Kit rank:</color> <#f4bd6a><rank></color>
      <#e8dfd2>Status:</color> <state>
      <#aaa49a>Free at least <required> main-inventory slots before claiming.</color>
    state:
      available: '<#9bd48d>available now</color>'
      delivering: '<#f4bd6a>delivery is already in progress</color>'
      claimed: '<#aaa49a>already claimed this week</color>'
