      <#9bd48d><bold>All three contracts for this week are complete.</bold></color>
      <#aaa49a>New offers will appear in the next weekly cycle.</color>
    loading: '<#e8dfd2>Loading weekly offers, the active contract and claimed stamps…</color>'
    saving: '<#e8dfd2>Checking the current contract state and applying the action…</color>'
  perks:
    title: '<#c4abff><bold>Path perks</bold></color>'
    intro: |-
      <#e8dfd2>Perks are two permanent passive effects that you choose.</color>
      <#aaa49a>They unlock through path tiers. Choose a slot, then a path and an effect. Selecting into an occupied slot replaces its old effect.</color>
    slot-empty: '<#e8dfd2>Slot <slot>:</color> <#aaa49a>empty — no effect selected.</color>'
    slot-active: '<#e8dfd2>Slot <slot>:</color> <#9bd48d><perk></color> <#aaa49a>— <description></color>'
