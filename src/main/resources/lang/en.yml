        - '<italic:false><#8c8c8c>Higher ranks receive more valuable contents.</color>'
        - '<italic:false><#8c8c8c>The next screen shows every item and the space required.</color>'
        - '<italic:false><#8c8c8c>A promotion does not grant a second kit that week.</color>'
        - '<italic:false><#8c8c8c>Your next kit becomes available on Monday.</color>'
        - '<italic:false><#8c8c8c> </color>'
