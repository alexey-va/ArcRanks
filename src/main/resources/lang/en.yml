      name: '<italic:false><#f4bd6a><bold>How progression works</bold></color>'
      lore:
        - '<italic:false><#fff0d8>Regular actions develop six different paths.</color>'
        - '<italic:false><#8c8c8c>Crops develop farming, crafting develops production,</color>'
        - '<italic:false><#8c8c8c>and chat messages develop the community path.</color>'
        - '<italic:false><#8c8c8c>To unlock the next rank, complete the required number of path goals.</color>'
        - '<italic:false><#8c8c8c>You do not need all six paths for a single rank.</color>'
        - '<italic:false><#8c8c8c>The star marks your focus: it only changes guidance</color>'
        - '<italic:false><#8c8c8c>and daily quest selection; it does not speed up progress.</color>'
        - '<italic:false><#8c8c8c>Daily quests award coins and additional path progress.</color>'
        - '<italic:false><#8c8c8c>Path tiers unlock passive upgrades.</color>'
