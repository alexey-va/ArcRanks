        - '<italic:false><#8c8c8c>Completed now: <completed-paths>/<required-paths>.</color>'
        - '<italic:false><#8c8c8c>• Raise path tiers — unlock passive upgrades.</color>'
        - '<italic:false><#8c8c8c> </color>'
        - '<italic:false><#8c8c8c>Each path grows when you perform actions that match it.</color>'
        - '<italic:false><#8c8c8c>Focus only changes guidance and daily quest selection.</color>'
